<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 4 · Die Enigma</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-offcanvas.css">
<link rel="stylesheet" href="station-04.css?v=11">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="../../shared/css/station-idle-reload.css">
</head>
<body>

<div id="scaler">
  <main id="frame" data-station-id="station-04" aria-label="Station 4 – Die Enigma">

    <!--
      Reusable station scaffold:
      - Keep this HTML as the stable shell for future stations.
      - Fill texts, images, keyboard states, and labels from station-04.js.
      - Future AI sessions should prefer changing the content object first and only
        extend the markup when a station truly needs a new UI module.
    -->

    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 4 - Kryptografie">
        <span class="station-marker__station">Station 4</span>
        <span class="station-marker__topic">Kryptografie</span>
      </div>
      <div class="start-copy">
        <span class="eyebrow" id="startEyebrow"></span>
        <h1 class="title title--hero" id="startTitle"></h1>
        <div class="hero-summary">
          <div class="hero-text" id="startIntro" aria-label="Einführungstext zur Enigma"></div>
          <!-- Öffnet die geteilte Leseansicht (shared/js/station-offcanvas.js). -->
          <button class="station-offcanvas-trigger" id="btnReadMore" type="button">Weiterlesen</button>
        </div>
      </div>

      <div class="start-visual" aria-hidden="true">
        <img src="" alt="" class="enigma-img" id="startImage">
      </div>

      <button class="cta" id="btnTry" type="button">
        <span class="cta-label" id="tryLabel"></span>
        <span class="cta-icon">
          <img src="../../00_design-system/symbols/brand-apple-arcade.svg" alt="">
        </span>
      </button>
    </section>

    <section class="screen screen-action hidden" id="screenAction">
      <!-- Gleiches Hintergrundbild und gleiche Position wie auf dem Startscreen. -->
      <div class="start-visual" aria-hidden="true">
        <img src="" alt="" class="enigma-img" id="actionImage">
      </div>

      <header class="action-hdr">
        <div class="action-hdr-copy">
          <h1 class="title title--compact" id="actionTitle"></h1>
        </div>
        <button class="close-btn" id="btnClose" aria-label="Schließen" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </header>

      <!-- Enigma nach Figma (enigma-2, 608:3949): Beschriftung | Maschine | Ausgabe/Eingabe,
           drei Zeilen Walzen / Lampenfeld / Tastatur. Platzierung in station-04.css. -->
      <div class="action-grid">
        <p class="row-label" id="rotorRowLabel"></p>
        <div class="row-content rotors" id="rotorList"></div>
        <p class="row-note" id="rotorNote"></p>

        <p class="row-label" id="outputRowLabel"></p>
        <div class="row-content" id="lampKeyboard"></div>
        <div class="io-box io-box--output">
          <span class="io-lbl" id="outputBoxLabel"></span>
          <span class="io-val" id="outputValue"></span>
        </div>

        <p class="row-label" id="inputRowLabel"></p>
        <div class="row-content" id="inputKeyboard"></div>
        <div class="row-side">
          <div class="io-box">
            <span class="io-lbl" id="inputBoxLabel"></span>
            <span class="io-val" id="inputValue"></span>
          </div>
          <button class="reset-btn" id="resetButton" type="button"></button>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="../../shared/js/station-idle-reload.js"></script>
<script src="../../shared/js/station-offcanvas.js"></script>
<script src="station-04.js?v=9"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 9 · Verordnetes Vertrauen</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-offcanvas.css">
<link rel="stylesheet" href="station-11.css?v=3">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="../../shared/css/station-idle-reload.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 9 – Verordnetes Vertrauen">

    <!-- Startscreen mit vollem Text und Vertiefung (rechts), keine Aktion. -->
    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 9 - Verordnetes Vertrauen">
        <span class="station-marker__station">Station 9</span>
        <span class="station-marker__topic">Verordnetes Vertrauen</span>
      </div>

      <div class="start-copy">
        <h1 class="title title--hero" id="startTitle"></h1>
        <div class="hero-summary">
          <div class="hero-text" id="startIntro" aria-label="Einführungstext zur Station"></div>
        </div>
      </div>

      <div class="start-visual" aria-hidden="true">
        <img class="station-image" src="dither-output.png" alt="">
      </div>

      <!-- Öffnet die Vertiefung als geteilte Leseansicht von rechts (shared/js/station-offcanvas.js). -->
      <button class="cta" id="btnDeepen" type="button">
        <span class="cta-label" data-offcanvas-label>Vertiefung</span>
        <span class="cta-icon">
          <img src="../../00_design-system/symbols/bulb.svg" alt="">
        </span>
      </button>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="../../shared/js/station-idle-reload.js"></script>
<script src="../../shared/js/station-offcanvas.js"></script>
<script src="station-11.js?v=1" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 6 · Was ist Geld?</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="station-08.css?v=3">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="../../shared/css/station-idle-reload.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 6 – Was ist Geld?">

    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 6 - Neue Entwicklungen">
        <span class="station-marker__station">Station 6</span>
        <span class="station-marker__topic">Neue Entwicklungen</span>
      </div>

      <div class="start-copy">
        <span class="eyebrow" id="startEyebrow"></span>
        <h1 class="title title--hero" id="startTitle"></h1>
        <div class="hero-text" id="startIntro" tabindex="0" aria-label="Einführungstext zur Station"></div>
      </div>

      <button class="cta" id="btnTry" type="button">
        <span class="cta-label" id="tryLabel"></span>
        <span class="cta-icon">
          <img src="../../00_design-system/symbols/brand-apple-arcade.svg" alt="">
        </span>
      </button>
    </section>

    <section class="screen screen-action hidden" id="screenAction">
      <header class="action-hdr">
        <div class="action-hdr-copy">
          <span class="eyebrow" id="actionEyebrow"></span>
          <h1 class="title title--compact" id="actionTitle"></h1>
        </div>
        <button class="close-btn" id="btnClose" aria-label="Schließen" type="button">✕</button>
      </header>

      <div class="deepdive-list" id="deepdiveList" aria-label="Vertiefungen"></div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="../../shared/js/station-idle-reload.js"></script>
<script src="base.js" defer></script>
<script src="station-08.js" defer></script>
</body>
</html>

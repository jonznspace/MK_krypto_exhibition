<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 6 · Was ist Geld?</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-offcanvas.css">
<link rel="stylesheet" href="station-08.css?v=16">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="../../shared/css/station-idle-reload.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 6 – Was ist Geld?">

    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 6 - Neue Entwicklungen">
        <span class="station-marker__station">Station 6</span>
        <span class="station-marker__topic">Neue Entwicklungen</span>
      </div>

      <header class="start-hdr">
        <h1 class="title title--hero" id="startTitle"></h1>
      </header>

      <div class="scroll-area start-scroll">
        <div class="scroll-area__scroller" id="startScroller" tabindex="0" aria-label="Einführungstext zur Station">
          <div class="hero-text" id="startIntro"></div>
        </div>
        <div class="station-offcanvas__scrollbar" aria-hidden="true"><div class="station-offcanvas__scrollbar-thumb"></div></div>
      </div>

      <button class="cta" id="btnTry" type="button">
        <span class="cta-label" id="tryLabel"></span>
        <span class="cta-icon">
          <img src="../../00_design-system/symbols/bulb.svg" alt="">
        </span>
      </button>
    </section>

    <section class="screen screen-action hidden" id="screenAction">
      <header class="action-hdr">
        <h2 class="title title--compact" id="actionTitle"></h2>
      </header>

      <div class="scroll-area deepdive-scroll">
        <div class="scroll-area__scroller" id="deepdiveList" aria-label="Vertiefungen"></div>
        <div class="station-offcanvas__scrollbar" aria-hidden="true"><div class="station-offcanvas__scrollbar-thumb"></div></div>
      </div>

      <!-- Sonderfall Stele: großer grauer Button statt ×, gleiche Position wie „Mehr erfahren“. -->
      <button class="cta cta--close" id="btnClose" type="button">
        <span class="cta-label">Schließen</span>
        <span class="cta-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </span>
      </button>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="../../shared/js/station-idle-reload.js"></script>
<script src="../../shared/js/station-offcanvas.js"></script>
<script src="station-08.bundle.js?v=4" defer></script>
</body>
</html>

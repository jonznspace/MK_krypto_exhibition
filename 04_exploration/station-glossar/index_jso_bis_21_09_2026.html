<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/*
SKALIERUNG-START
SUCHWORT: DISPLAY_SCALE_SETTINGS
SUCHWORT: manualScale

WICHTIG:
- Die zentrale Skalierung wird weiter unten im Script eingestellt.
- Wenn ihr spaeter fuer einen anderen Tisch anpassen wollt, sucht nach DISPLAY_SCALE_SETTINGS.
- Alle Groessen hier im CSS reagieren automatisch auf --ui-scale.
*/
:root {
    --ui-scale: 1;
}

/* Switzer (Body) */
@font-face {
  font-family: "Switzer";
  src: url("../../../GITHUB/KRYPTOWAS_MK/MK_krypto_exhibition/00_design-system/fonts/switzer/Switzer-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
/* DM Mono (Labels, uppercase only) */
@font-face {
  font-family: "DM Mono";
  src: url("../../../GITHUB/KRYPTOWAS_MK/MK_krypto_exhibition/00_design-system/fonts/dm-mono/DMMono-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "DM Mono";
  src: url("../../../GITHUB/KRYPTOWAS_MK/MK_krypto_exhibition/00_design-system/fonts/dm-mono/DMMono-Medium.woff2") format("woff2");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: "Switzer", "Segoe UI", system-ui, sans-serif;
    -webkit-touch-callout: none;
}

.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.card {
    position: absolute;
    width: calc(170px * var(--ui-scale));
    height: calc(130px * var(--ui-scale));
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(48px * var(--ui-scale));
    font-weight: bold;
    color: #FFFFFF;
    cursor: grab;
    touch-action: none;
    background: #0B0B0F;
    border: 1px solid #292C33;
    transition: transform 80ms linear, width 240ms linear, height 240ms linear, opacity 80ms linear;
    overflow: hidden;
}

.card:active {
    cursor: grabbing;
    opacity: 0.75;
}

.card.open {
    width: calc(340px * var(--ui-scale));
    height: calc(360px * var(--ui-scale));
    padding: calc(16px * var(--ui-scale));
    align-items: stretch;
    justify-content: flex-start;
    cursor: default;
    transform: none;
    background: #1A1C23;
    border: 1px solid #292C33;
    opacity: 1;
}

.card-symbol {
    display: block;
    width: 100%;
    padding: calc(10px * var(--ui-scale));
    box-sizing: border-box;
    text-align: center;
    font-size: clamp(calc(12px * var(--ui-scale)), calc(1.5vw * var(--ui-scale)), calc(20px * var(--ui-scale)));
    font-weight: 700;
    line-height: 1.2;
    word-break: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
}

.card-content {
    display: none;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    flex-direction: column;
    gap: calc(8px * var(--ui-scale));
    text-align: left;
    overflow-y: auto;
    padding-right: calc(4px * var(--ui-scale));
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
    touch-action: none;
}

.card * {
    touch-action: none;
}

.card.open .card-symbol {
    display: none;
}

.card.open .card-content {
    display: flex;
}

.card-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(10px * var(--ui-scale));
    flex-shrink: 0;
}

.card-title {
    margin: 0;
    font-size: calc(18px * var(--ui-scale));
    line-height: 1.15;
    color: #FFFFFF;
    font-family: "Switzer", system-ui, sans-serif;
    font-weight: 600;
}

.card-gruppe {
    font-family: "DM Mono", monospace;
    font-size: calc(10px * var(--ui-scale));
    font-weight: 400;
    letter-spacing: calc(1px * var(--ui-scale));
    text-transform: uppercase;
    color: #7D8290;
    flex-shrink: 0;
    margin: 0 0 calc(3px * var(--ui-scale)) 0;
}

.card-text {
    margin: 0;
    color: #C7CBD3;
    font-size: calc(13px * var(--ui-scale));
    line-height: 1.5;
    flex-shrink: 0;
}

.card-close {
    flex: 0 0 auto;
    width: calc(44px * var(--ui-scale));
    height: calc(44px * var(--ui-scale));
    border: 0;
    border-radius: 0;
    background: #F79530;
    color: #000000;
    font-size: calc(20px * var(--ui-scale));
    font-weight: 700;
    cursor: pointer;
    transition: background 80ms linear;
}

.card-close:hover {
    background: #ED8003;
}

/* Vertiefung — Blau = Information (C3) */
.card-vertiefung-btn {
    flex-shrink: 0;
    padding: calc(6px * var(--ui-scale)) calc(12px * var(--ui-scale));
    border: 1px solid #0040FF;
    border-radius: 0;
    background: rgba(0, 64, 255, 0.12);
    color: #0040FF;
    font-family: "DM Mono", monospace;
    font-size: calc(11px * var(--ui-scale));
    font-weight: 400;
    letter-spacing: calc(0.8px * var(--ui-scale));
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
    transition: background 80ms linear;
}

.card-vertiefung-btn:hover {
    background: rgba(38, 78, 255, 0.20);
}

.card-vertiefung-wrap {
    flex-shrink: 0;
    border-top: 1px solid #292C33;
    padding-top: calc(8px * var(--ui-scale));
}

.card-vertiefung-text {
    margin: 0;
    font-size: calc(12px * var(--ui-scale));
    color: #C7CBD3;
    line-height: 1.55;
}

/* Sprach-Toggle je Karte — Orange = Action (C2) */
.card-controls {
    display: flex;
    align-items: center;
    gap: calc(4px * var(--ui-scale));
    flex-shrink: 0;
}

.card-lang-btn {
    padding: 0 calc(10px * var(--ui-scale));
    height: calc(44px * var(--ui-scale));
    border: 0;
    border-radius: 0;
    background: rgba(247, 149, 48, 0.15);
    color: #F79530;
    font-family: "DM Mono", monospace;
    font-size: calc(11px * var(--ui-scale));
    font-weight: 400;
    letter-spacing: calc(1px * var(--ui-scale));
    text-transform: uppercase;
    cursor: pointer;
    transition: background 80ms linear;
}

.card-lang-btn:hover {
    background: rgba(247, 149, 48, 0.28);
}

/* Loading indicator */
.loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.5);
    font-size: calc(18px * var(--ui-scale));
    letter-spacing: calc(1px * var(--ui-scale));
    pointer-events: none;
}

.hint {
    position: absolute;
    left: 50%;
    bottom: calc(16px * var(--ui-scale));
    transform: translateX(-50%);
    padding: calc(8px * var(--ui-scale)) calc(16px * var(--ui-scale));
    border-radius: 0;
    border: 1px solid #292C33;
    background: #0B0B0F;
    color: #7D8290;
    font-family: "DM Mono", monospace;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: calc(1px * var(--ui-scale));
    text-transform: uppercase;
    pointer-events: none;
    z-index: 1;
    white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card-close, .card-vertiefung-btn, .card-lang-btn { transition: none; }
}
</style>
</head>
<body>

<div class="loading" id="loading">Lade Daten …</div>

<main class="stage" id="stage">
    <div class="hint" id="hint">Greifen zum Ziehen, kurz tippen zum Lesen</div>
</main>

<script>
(async function () {
    const stage     = document.getElementById('stage');
    const hint      = document.getElementById('hint');
    const loadingEl = document.getElementById('loading');

    let cardItems   = [];

        /*
        SKALIERUNG-EINSTELLUNGEN
        SUCHWORT: DISPLAY_SCALE_SETTINGS
        SUCHWORT: TISCH-4K

        HIER AENDERN:
        - referenceWidth/referenceHeight:
            Die Aufloesung, an der sich die Startgroesse orientiert.
            Richtwert: 1920 x 1080 = auf 4K wird alles deutlich groesser.
            Richtwert: 3840 x 2160 = auf 4K bleibt alles bewusst kompakter.

        - manualScale:
            Zusaetzlicher Feintuning-Faktor fuer alles zusammen.
            Richtwert: 1 = normal, 0.9 = etwas kleiner, 1.1 = etwas groesser, 1.25 = deutlich groesser.

        - minScale:
            Untere Grenze, damit auf kleineren Displays nicht alles zu winzig wird.
            Richtwert: 0.85 = eher kompakt, 1 = nie kleiner als Originalgroesse.

        - maxScale:
            Obere Grenze, damit auf sehr grossen Displays nicht alles zu riesig wird.
            Richtwert: 2 = doppelt so gross, 2.4 = etwas groesser als doppelt.

        - fitMode:
            'contain' = orientiert sich an der kleineren Bildschirmseite, meist die sicherste Wahl.
            'width'   = skaliert nach Bildschirmbreite.
            'height'  = skaliert nach Bildschirmhoehe.

        TISCH-4K STARTWERT:
        Diese Datei startet jetzt bewusst mit einem 4K-Preset.
        Das bedeutet: Auf einem 3840 x 2160 Tisch bleiben Karten und Texte kompakter,
        statt automatisch doppelt so gross zu werden.

        Aktueller 4K-Startwert:
        referenceWidth: 3840
        referenceHeight: 2160
        manualScale: 1

        Falls es auf dem echten Tisch noch etwas zu klein wirkt:
        manualScale: 1.05 oder 1.1
        Falls es noch kompakter werden soll:
        manualScale: 0.95
        */
    const DISPLAY_SCALE_SETTINGS = {
        referenceWidth: 3840,
        referenceHeight: 2160,
        manualScale: 1,
        minScale: 0.85,
        maxScale: 2.4,
        fitMode: 'contain'
    };

    function computeDisplayScale() {
        const widthScale = window.innerWidth / DISPLAY_SCALE_SETTINGS.referenceWidth;
        const heightScale = window.innerHeight / DISPLAY_SCALE_SETTINGS.referenceHeight;

        let viewportScale = Math.min(widthScale, heightScale);
        if (DISPLAY_SCALE_SETTINGS.fitMode === 'width') {
            viewportScale = widthScale;
        } else if (DISPLAY_SCALE_SETTINGS.fitMode === 'height') {
            viewportScale = heightScale;
        }

        const scaledValue = viewportScale * DISPLAY_SCALE_SETTINGS.manualScale;
        return Math.min(
            DISPLAY_SCALE_SETTINGS.maxScale,
            Math.max(DISPLAY_SCALE_SETTINGS.minScale, scaledValue)
        );
    }

    function applyDisplayScale(overrides = {}) {
        Object.assign(DISPLAY_SCALE_SETTINGS, overrides);
        const nextScale = computeDisplayScale();
        // SKALIERUNG-AKTIV: Dieser Wert steuert das gesamte UI zentral.
        document.documentElement.style.setProperty('--ui-scale', nextScale.toFixed(4));
        return nextScale;
    }

    window.DISPLAY_SCALE_SETTINGS = DISPLAY_SCALE_SETTINGS;
    window.applyDisplayScale = applyDisplayScale;

    document.addEventListener('contextmenu', event => {
        event.preventDefault();
    });

    applyDisplayScale();

    // Alle Karten: neutrale dunkle Fläche (layer-surface-raised, Design-System)
    // Gruppen-Outline — Farbe trägt Bedeutung (Kategorie), alle Werte aus Token-Palette
    const GROUP_BORDER_COLORS = {
        "Grundbegriffe":          "#4B72FF",  // secondary/400 — Wissen/Information (mittleres Blau)
        "Markt & Psychologie":    "#F79530",  // primary/400   — Aktivität/Markt
        "Staat, Regeln, Risiken": "#C7CBD3",  // neutral/300   — formal/institutionell
        "Geldgeschichte":         "#7D8290",  // neutral/500   — historisch/gedämpft
        "Zukunft":                "#A3B8FF",  // secondary/200 — Ausblick/Potenzial (deutlich heller)
    };
    const DEFAULT_BORDER = "#292C33"; // layer-border

    const REFERENCE_ALIASES = {
        'kryptowahrung': 'kryptowahrung-krypto-vermogenswert',
        'token-coin': 'coin-token'
    };

    function normalizeReferenceKey(value) {
        return (value || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/&/g, ' und ')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
    }

    function resolveReferenceKey(value) {
        const key = normalizeReferenceKey(value);
        return REFERENCE_ALIASES[key] || key;
    }

    // Daten direkt eingebettet – kein fetch/Server nötig
    loadingEl.remove();
    const data = [{"nr":1,"gruppe":"Grundbegriffe","begriff_de":"Blockchain","term_en":"Blockchain","ebene_1_kurzdefinition_de":"Eine Art digitales Kassenbuch, das nicht bei einer Bank liegt, sondern gleichzeitig auf tausenden Computern. Jeder Eintrag wird an den vorherigen gekettet – nachträglich ändern lässt er sich kaum.","level_1_short_definition_en":"A kind of digital ledger that is not held by a bank but exists simultaneously on thousands of computers. Each entry is chained to the previous one, making later changes nearly impossible.","ebene_2_vertiefung_de":"Der Name beschreibt den Aufbau: Zahlungen werden zu Blöcken gebündelt, jeder Block enthält einen digitalen Fingerabdruck des vorherigen. Wer einen alten Eintrag ändern wollte, müsste alle folgenden Blöcke neu berechnen – auf tausenden Rechnern gleichzeitig. Vertrauen entsteht dabei nicht durch die Technik allein, sondern dadurch, dass viele unabhängige Beteiligte dieselbe Liste führen und sich gegenseitig kontrollieren. Was in der Blockchain steht, ist damit schwer zu fälschen. Ob es stimmt, prüft sie allerdings nicht.","level_2_extended_en":"The name describes the structure: payments are bundled into blocks, and each block contains a digital fingerprint of the previous one. Changing an old entry would mean recalculating every subsequent block – on thousands of computers at once. Trust arises not from the technology alone, but from many independent participants keeping the same list and checking one another. What is written in the blockchain is therefore hard to falsify. Whether it is true, however, the blockchain does not verify.","querverweise":"Bitcoin; Vertrauen","aktualisierung":"Stabil"},{"nr":2,"gruppe":"Grundbegriffe","begriff_de":"Bitcoin","term_en":"Bitcoin","ebene_1_kurzdefinition_de":"Die erste Kryptowährung, gestartet 2009. Sie funktioniert ohne Bank und ohne Staat: Ein weltweites Computernetzwerk führt gemeinsam Buch über alle Zahlungen.","level_1_short_definition_en":"The first cryptocurrency, launched in 2009. It works without banks or governments: a worldwide computer network jointly keeps the record of all payments.","ebene_2_vertiefung_de":"Bitcoin entstand nach der Finanzkrise 2008 als Gegenentwurf zum Bankensystem. Die Menge ist auf 21 Millionen begrenzt, niemand kann sie erhöhen. Wer Bitcoin besitzt, besitzt keinen Gegenstand, sondern das Recht, über einen Eintrag zu verfügen – nachgewiesen durch einen digitalen Schlüssel. Als Zahlungsmittel spielt Bitcoin heute kaum eine Rolle; die meisten halten es als Anlage. Damit hat sich die ursprüngliche Idee verschoben: gedacht als Geld, genutzt als Spekulationsobjekt.","level_2_extended_en":"Bitcoin emerged after the 2008 financial crisis as a counter-model to the banking system. The supply is capped at 21 million and cannot be increased by anyone. Owning bitcoin means owning not an object but the right to dispose of an entry – proven by a digital key. As a means of payment bitcoin plays little role today; most people hold it as an investment. The original idea has thus shifted: conceived as money, used as an object of speculation.","querverweise":"Blockchain; Spekulation","aktualisierung":"Stabil"},{"nr":3,"gruppe":"Grundbegriffe","begriff_de":"Kryptowährung / Krypto-Vermögenswert","term_en":"Cryptocurrency / crypto asset","ebene_1_kurzdefinition_de":"Zwei Begriffe für dieselbe Sache – mit einem Unterschied. \u201eWährung\u201c verspricht Geld; \u201eVermögenswert\u201c sagt: Es wird gehalten, nicht ausgegeben. Behörden bevorzugen den zweiten Begriff.","level_1_short_definition_en":"Two terms for the same thing – with one difference. \u201cCurrency\u201d promises money; \u201casset\u201d says: it is held, not spent. Regulators prefer the second term.","ebene_2_vertiefung_de":"Geld muss drei Dinge können: bezahlen, Werte aufbewahren und Preise vergleichbar machen. Bitcoin und ähnliche Systeme erfüllen vor allem das zweite, und das schwankend. Weil kaum jemand damit bezahlt und die Kurse stark schwanken, sprechen die Europäische Zentralbank und die Aufsichtsbehörden von Krypto-Vermögenswerten statt von Währungen. Die Wortwahl ist keine Kleinigkeit: Sie entscheidet mit darüber, welche Regeln gelten – die des Zahlungsverkehrs oder die des Wertpapierhandels.","level_2_extended_en":"Money must do three things: pay, store value and make prices comparable. Bitcoin and similar systems mainly do the second, and unreliably at that. Because hardly anyone pays with them and prices fluctuate sharply, the European Central Bank and financial regulators speak of crypto assets rather than currencies. This choice of words is no trifle: it helps determine which rules apply – those of payments or those of securities trading.","querverweise":"Bitcoin; Regulierung (MiCA); Volatilität","aktualisierung":"Stabil"},{"nr":4,"gruppe":"Grundbegriffe","begriff_de":"Satoshi Nakamoto","term_en":"Satoshi Nakamoto","ebene_1_kurzdefinition_de":"Das Pseudonym der Person oder Gruppe, die 2008 das Bitcoin-Konzept veröffentlichte. Die wahre Identität ist bis heute unbekannt.","level_1_short_definition_en":"The pseudonym of the person or group who published the Bitcoin concept in 2008. The true identity remains unknown to this day.","ebene_2_vertiefung_de":"2008 erschien unter diesem Namen ein neunseitiges Papier, 2009 folgte die Software. 2011 verschwand Satoshi Nakamoto aus der Öffentlichkeit. Zurück blieb ein Bestand von rund einer Million Bitcoin, der seither unbewegt ist. Immer wieder werden Namen gehandelt, bewiesen ist keiner. Für das System ist das folgerichtig: Bitcoin sollte ohne vertrauenswürdige Person auskommen. Der unbekannte Erfinder ist damit weniger ein Rätsel als ein Prinzip – Geld, das keinen Namen braucht.","level_2_extended_en":"In 2008 a nine-page paper appeared under this name; the software followed in 2009. In 2011 Satoshi Nakamoto withdrew from public view, leaving behind a holding of around one million bitcoin that has remained untouched ever since. Names are repeatedly suggested, none proven. For the system this is consistent: Bitcoin was meant to work without a trusted person. The unknown inventor is therefore less a riddle than a principle – money that needs no name.","querverweise":"Bitcoin","aktualisierung":"Stabil"},{"nr":5,"gruppe":"Grundbegriffe","begriff_de":"Wallet","term_en":"Wallet","ebene_1_kurzdefinition_de":"Die \u201eGeldbörse\u201c für Kryptowerte. Sie enthält kein Geld, sondern sogenannte keys, Schlüssel: Nur wer den privaten Schlüssel besitzt, kann über das zugehörige Guthaben verfügen.","level_1_short_definition_en":"The \u201cwallet\u201d for crypto assets. It contains no money but keys: only the holder of the private key can dispose of the corresponding funds.","ebene_2_vertiefung_de":"Das Guthaben liegt immer im Netzwerk, nie in der Wallet. Verwahrt wird ein Schlüsselpaar: eine öffentliche Adresse, an die andere zahlen, und ein privater Schlüssel, mit dem man selbst zahlt. Geht der private Schlüssel verloren, ist das Guthaben unwiderruflich unerreichbar – niemand kann ihn zurücksetzen. Schätzungen zufolge sind auf diese Weise Millionen Bitcoin dauerhaft verloren. Anders als bei einer Bank gibt es keine Stelle, die weiterhilft.","level_2_extended_en":"The funds always sit in the network, never in the wallet. What is stored is a key pair: a public address others pay into, and a private key you pay with. If the private key is lost, the funds are irretrievably out of reach – nobody can reset it. Millions of bitcoin are estimated to be permanently lost this way. Unlike with a bank, there is no office to turn to.","querverweise":"Selbstverwahrung; Digitale Identität; Agent Payments","aktualisierung":"Stabil"},{"nr":6,"gruppe":"Grundbegriffe","begriff_de":"Coin / Token","term_en":"Coin / Token","ebene_1_kurzdefinition_de":"Ein Coin hat eine eigene Blockchain. Ein Token nutzt eine fremde. Bitcoin ist ein Coin; die allermeisten anderen digitalen Werte sind Token.","level_1_short_definition_en":"A coin has its own blockchain. A token uses someone else's. Bitcoin is a coin; the vast majority of other digital assets are tokens.","ebene_2_vertiefung_de":"Der Unterschied ist technisch, hat aber Folgen. Einen Coin herzustellen heißt, ein eigenes Netzwerk aufzubauen. Einen Token herzustellen dauert Minuten. Man schreibt ihn in ein bestehendes System wie Ethereum. Deshalb gibt es Millionen Token, aber nur wenige bedeutende Coins. Token können sehr Unterschiedliches darstellen: Anteile, Stimmrechte, Zugangsrechte, Kunstwerke oder auch nur einen Scherz. Was ein Token wert ist, ergibt sich nicht aus der Technik, sondern daraus, was jemand dafür zu zahlen bereit ist.","level_2_extended_en":"The difference is technical but consequential. Creating a coin means building an entire network. Creating a token takes minutes. You write it into an existing system such as Ethereum. Hence there are millions of tokens but only a few significant coins. Tokens can represent very different things: shares, voting rights, access rights, artworks, or merely a joke. A token's worth follows not from the technology but from what someone is willing to pay for it.","querverweise":"Memecoin; Tokenisierung von Realwerten; NFT","aktualisierung":"Stabil"},{"nr":7,"gruppe":"Grundbegriffe","begriff_de":"Smart Contract","term_en":"Smart contract","ebene_1_kurzdefinition_de":"Ein Programm auf einer Blockchain, das eine Vereinbarung automatisch ausführt: Ist eine Bedingung erfüllt, erfolgt die Zahlung ohne Notar und ohne Bank.","level_1_short_definition_en":"A program on a blockchain that executes an agreement automatically: once a condition is met, the payment happens without notary or bank.","ebene_2_vertiefung_de":"Der Name führt in die Irre: Ein Smart Contract ist weder klug noch ein Vertrag im rechtlichen Sinn, sondern Programmcode. Er läuft, sobald eine vereinbarte Bedingung eintritt, und lässt sich nachträglich meist nicht ändern. Das macht ihn verlässlich, aber zugleich riskant: Ein Programmierfehler kann nicht korrigiert werden, und wer eine Lücke im Code ausnutzt, hat formal keine Regel gebrochen. In mehreren spektakulären Fällen verschwanden so Millionenbeträge, ohne dass jemand haftbar war.","level_2_extended_en":"The name is misleading: a smart contract is neither smart nor a contract in the legal sense, but program code. It runs as soon as the agreed condition occurs and usually cannot be changed afterwards. This makes it reliable, but also risky: a programming error cannot be corrected, and whoever exploits a gap in the code has formally broken no rule. In several spectacular cases millions disappeared this way, with nobody liable.","querverweise":"DeFi; Programmierbares Geld","aktualisierung":"Stabil"},{"nr":8,"gruppe":"Grundbegriffe","begriff_de":"Kryptobörse","term_en":"Crypto exchange","ebene_1_kurzdefinition_de":"Handels- und Verwahrplatz für Kryptowerte. Hier tauschen Nutzer Euro gegen Kryptowerte und geben dafür meist die Kontrolle über ihre Schlüssel ab.","level_1_short_definition_en":"A marketplace for crypto assets, which also holds them. Here users exchange euros for crypto assets and usually hand over control of their keys in the process.","ebene_2_vertiefung_de":"Die meisten Menschen kommen über eine Börse mit Krypto in Berührung. Bequem ist das, weil die Börse die Schlüssel verwahrt. Genau darin liegt der Widerspruch: Ein System, das ohne zentrale Instanz auskommen wollte, wird überwiegend über zentrale Unternehmen genutzt. Fällt eine Börse aus, durch hacks oder Insolvenz, können Kundinnen und Kunden ihre Guthaben verlieren (keine Einlagensicherung wie in der klassischen Bankenwelt); wie 2014 bei Mt. Gox und 2022 bei FTX. Daher der geflügelte Satz der Szene: \u201eNicht deine Schlüssel, nicht deine Coins.\u201c","level_2_extended_en":"Most people encounter crypto through an exchange. This is convenient because the exchange holds the keys. Therein lies the contradiction: a system meant to work without a central authority is mostly used through central private companies. When an exchange fails because of hacks or insolvency, its customers' balances can be lost (no deposit insurance) as with Mt. Gox in 2014 and FTX in 2022. Hence the saying in the scene: \u201cNot your keys, not your coins.\u201d","querverweise":"Selbstverwahrung; Wallet","aktualisierung":"Stabil"},{"nr":9,"gruppe":"Grundbegriffe","begriff_de":"Stablecoin","term_en":"Stablecoin","ebene_1_kurzdefinition_de":"Ein Krypto-Token, dessen Wert an eine Währung gekoppelt ist, meist an den US-Dollar. Er soll die Schwankungen vermeiden, für die etwa Bitcoin bekannt ist.","level_1_short_definition_en":"A crypto token whose value is pegged to a currency, usually the US dollar. It is designed to avoid the fluctuations bitcoin is known for.","ebene_2_vertiefung_de":"Stablecoins sind heute das Rückgrat des Kryptohandels und zugleich das Zahlungsmittel autonomer KI-Agenten. Ihre Stabilität stammt nicht aus der Technik, sondern aus einem Versprechen: Für jeden ausgegebenen Token liege eine echte Rücklage bereit. Ob das zutrifft, muss geprüft werden. Zusammenbrüche wie jener von Terra/UST 2022 zeigten, was geschieht, wenn die Deckung nur aus einem algorithmischen Rechenmodell besteht.","level_2_extended_en":"Stablecoins are today the backbone of crypto trading and at the same time the means of payment for autonomous AI agents. Their stability comes not from technology but from a promise: that a genuine reserve is held for every token issued. Whether that holds true must be verified. Collapses such as Terra/UST in 2022 showed what happens when the backing consists only of a mathematical model.","querverweise":"Deckung; Agent Payments","aktualisierung":"Jährlich prüfen"},{"nr":10,"gruppe":"Grundbegriffe","begriff_de":"DeFi","term_en":"DeFi","ebene_1_kurzdefinition_de":"Finanzgeschäfte ohne Bank: verleihen, tauschen, Zinsen erhalten – abgewickelt von Programmen auf einer Blockchain. Die Abkürzung steht für \u201eDecentralized Finance\u201c.","level_1_short_definition_en":"Financial services without banks: lending, swapping, earning interest – handled by programs on a blockchain. The abbreviation stands for \u201cdecentralized finance\u201d.","ebene_2_vertiefung_de":"In DeFi ersetzen Programme die Institution. Wer Geld verleiht, schließt keinen Vertrag mit einer Bank, sondern hinterlegt Kryptowerte in einem Smart Contract, der Zinsen automatisch berechnet. Es gibt aber auch keine Einlagensicherung, keine Beschwerdestelle und keine Rückbuchung. Durch Programmierfehler und Hacker-Angriffe gingen bereits Milliardenbeträge verloren.","level_2_extended_en":"In DeFi, programs replace the institution. Lending money means depositing crypto assets in a smart contract that calculates interest automatically. But there is also no deposit insurance, no complaints office and no chargeback. Programming errors and hacks have already destroyed billions.","querverweise":"Smart Contract; Verbraucherschutz; Kryptobörse","aktualisierung":"Stabil"},{"nr":11,"gruppe":"Grundbegriffe","begriff_de":"NFT","term_en":"NFT","ebene_1_kurzdefinition_de":"Ein Token, der nicht austauschbar ist und einen bestimmten digitalen Gegenstand kennzeichnet, etwa ein Bild. Er belegt einen Eintrag, nicht unbedingt ein Eigentumsrecht.","level_1_short_definition_en":"A token that is not interchangeable and marks a specific digital item, such as an image. It documents an entry, not necessarily a right of ownership.","ebene_2_vertiefung_de":"Um 2021 wurden NFTs als neue Kunstform gehandelt, einzelne Werke erzielten Millionenbeträge. Was Käuferinnen und Käufer erwarben, war meist nicht das Bild selbst, sondern ein Eintrag in einer Blockchain, der auf das Bild verweist. Als die Nachfrage nachließ, verloren die meisten NFTs nahezu ihren gesamten Wert.","level_2_extended_en":"Around 2021 NFTs were traded as a new art form, with individual works fetching millions. What buyers acquired was usually not the image itself but an entry in a blockchain pointing to the image. When demand faded, most NFTs lost almost all their value.","querverweise":"Token / Coin; Hype-Zyklus; Tokenisierung von Realwerten","aktualisierung":"Stabil"},{"nr":12,"gruppe":"Markt & Psychologie","begriff_de":"Volatilität","term_en":"Volatility","ebene_1_kurzdefinition_de":"Das Maß für Kursschwankungen. Kryptowerte gelten als hochvolatil. Ihr Preis kann innerhalb von Stunden zweistellig steigen oder fallen.","level_1_short_definition_en":"The measure of price fluctuation. Crypto assets are considered highly volatile. Their price can rise or fall by double-digit percentages within hours.","ebene_2_vertiefung_de":"Der Preis eines Kryptowerts ergibt sich allein aus Angebot und Nachfrage. Es gibt keine Zentralbank, die eingreift, keine Erträge wie bei einer Aktie und keinen Materialwert wie bei Gold. Deshalb wirken Nachrichten, Gerüchte und Stimmungen unmittelbar auf den Kurs.","level_2_extended_en":"The price of a crypto asset arises solely from supply and demand. There is no central bank to intervene, no earnings as with a share and no material value as with gold. News, rumours and sentiment therefore act directly on the price.","querverweise":"Spekulation; Stablecoin","aktualisierung":"Stabil"},{"nr":13,"gruppe":"Markt & Psychologie","begriff_de":"Spekulation","term_en":"Speculation","ebene_1_kurzdefinition_de":"Der Kauf eines Werts in der Erwartung, ihn später teurer zu verkaufen. Nicht der Nutzen zählt dabei, sondern die Preisentwicklung.","level_1_short_definition_en":"Buying an asset in the expectation of selling it later at a higher price. What counts is not its usefulness but its price development.","ebene_2_vertiefung_de":"Spekulation ist so alt wie der Handel und nicht auf Krypto beschränkt: Tulpenzwiebeln, Aktien der Ostindien-Kompanien, Eisenbahnaktien und Immobilien waren zu ihrer Zeit ebenso Gegenstand von Erwartungen. Neu sind Tempo und Zugänglichkeit.","level_2_extended_en":"Speculation is as old as trade and not confined to crypto: tulip bulbs, East India Company shares, railway stocks and property were all objects of expectation in their time. What is new is speed and accessibility.","querverweise":"Hype-Zyklus; Volatilität","aktualisierung":"Stabil"},{"nr":14,"gruppe":"Markt & Psychologie","begriff_de":"Hype-Zyklus","term_en":"Hype cycle","ebene_1_kurzdefinition_de":"Das wiederkehrende Muster aus Begeisterung, Übertreibung, Absturz und Ernüchterung. Der Kryptomarkt hat es seit 2009 mehrfach durchlaufen.","level_1_short_definition_en":"The recurring pattern of enthusiasm, exaggeration, crash and disillusionment. The crypto market has been through it several times since 2009.","ebene_2_vertiefung_de":"Ein wiederkehrender Verlauf, bei dem eine neue Technologie zunächst große Aufmerksamkeit und überhöhte Erwartungen auslöst. Bitcoin-Welle (2011–2014), ICO-Welle (2016–2018), DeFi-Welle (2020–2021), NFT/Memecoin-Welle (2021–2022), Kryptowinter (2022–2023), Institutionalisierung (seit 2023/2024).","level_2_extended_en":"A recurring pattern in which a new technology initially attracts great attention and inflated expectations. Bitcoin wave (2011–2014), ICO wave (2016–2018), DeFi wave (2020–2021), NFT/memecoin wave (2021–2022), crypto winter (2022–2023), institutionalisation (since 2023/2024).","querverweise":"Spekulation; NFT","aktualisierung":"Stabil"},{"nr":15,"gruppe":"Markt & Psychologie","begriff_de":"Memecoin","term_en":"Memecoin","ebene_1_kurzdefinition_de":"Ein Kryptowert ohne technischen oder wirtschaftlichen Zweck, dessen Kurs sich allein aus Aufmerksamkeit speist – oft ausgelöst durch Internetwitze oder Prominente.","level_1_short_definition_en":"A crypto asset with no technical or economic purpose, whose price is driven purely by attention; often triggered by internet jokes or celebrities.","ebene_2_vertiefung_de":"Da sich Token in Minuten erzeugen lassen, entstehen laufend neue Memecoins. Ihr Kurs folgt keiner Geschäftsentwicklung, sondern der Reichweite in sozialen Medien. Für Beobachter zeigen sie, wie wenig ein handelbarer Wert benötigt, um zu entstehen.","level_2_extended_en":"Because tokens can be created in minutes, new memecoins appear continuously. Their price follows no business development but reach on social media. For observers they show how little a tradable asset needs in order to come into being.","querverweise":"Token / Coin; Spekulation; Hype-Zyklus","aktualisierung":"Stabil"},{"nr":16,"gruppe":"Markt & Psychologie","begriff_de":"Bitcoin-ETF","term_en":"Bitcoin ETF","ebene_1_kurzdefinition_de":"Ein Börsenprodukt, über das sich Bitcoin wie eine Aktie kaufen lässt – ohne Wallet und ohne eigene Schlüssel. In den USA seit 2024 zugelassen.","level_1_short_definition_en":"An exchange-traded product that allows bitcoin to be bought like a share. Without a wallet or private keys. Approved in the USA since 2024.","ebene_2_vertiefung_de":"Ein ETF bündelt einen Vermögenswert und macht ihn über gewöhnliche Wertpapierdepots handelbar. Die Zulassung 2024 ermöglichte Banken, Fonds und Versicherungen zu investieren. Wer über einen ETF investiert, besitzt aber keine Bitcoin, sondern einen Anspruch gegenüber einem Anbieter.","level_2_extended_en":"An ETF bundles an asset and makes it tradable through ordinary securities accounts. Approval in 2024 let banks, funds and insurers invest. Anyone investing via an ETF owns no bitcoin but a claim against a provider.","querverweise":"Bitcoin; Selbstverwahrung; Regulierung (MiCA)","aktualisierung":"Jährlich prüfen"},{"nr":17,"gruppe":"Markt & Psychologie","begriff_de":"Rug Pull","term_en":"Rug pull","ebene_1_kurzdefinition_de":"Eine Betrugsform: Gründer eines Projekts verkaufen Token, treiben den Kurs hoch und verkaufen ihren eigenen Anteil auf einen Schlag. Die übrigen Käufer verlieren ihr Geld.","level_1_short_definition_en":"A form of fraud: founders sell tokens, drive up the price and then dump their own share all at once. The remaining buyers lose their money.","ebene_2_vertiefung_de":"Neue Token lassen sich ohne staatliche Prüfung veröffentlichen. Wer sie herausgibt, kann anonym bleiben und behält häufig einen großen Anteil. Steigt der Kurs, wird dieser Anteil auf einem Schlag verkauft. Genau hier setzen die neuen europäischen Regeln an.","level_2_extended_en":"New tokens can be issued without any vetting. Those who issue them can remain anonymous and often keep a large share. When the price rises, they sell that share all at once. It is precisely here that the new European rules take effect.","querverweise":"Verbraucherschutz; Regulierung (MiCA); Kriminalität","aktualisierung":"Stabil"},{"nr":18,"gruppe":"Markt & Psychologie","begriff_de":"Pseudonymität","term_en":"Pseudonymity","ebene_1_kurzdefinition_de":"Kryptozahlungen sind nicht anonym, sondern pseudonym: Sichtbar ist eine Adresse statt eines Namens. Alle Zahlungen dieser Adresse bleiben dauerhaft öffentlich einsehbar.","level_1_short_definition_en":"Crypto payments are not anonymous but pseudonymous: an address is visible instead of a name. All payments from that address remain permanently open to inspection.","ebene_2_vertiefung_de":"Ein verbreitetes Missverständnis lautet, Bitcoin sei anonym. Tatsächlich ist die Blockchain öffentlich: Jede Zahlung ist für alle einsehbar, dauerhaft und rückwirkend. Lässt sich die Verbindung zur Identität einmal herstellen, wird die gesamte Zahlungsgeschichte zuordenbar. Bargeld ist anonymer.","level_2_extended_en":"A widespread misconception holds that bitcoin is anonymous. In fact the blockchain is public: every payment is visible to all, permanently and retrospectively. Once the link to an identity is established, the entire payment history becomes attributable. Cash is more anonymous.","querverweise":"KYC; Kriminalität; Digitale Identität","aktualisierung":"Stabil"},{"nr":19,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Regulierung (MiCA)","term_en":"Regulation (MiCA)","ebene_1_kurzdefinition_de":"Die EU-Verordnung \u201eMarkets in Crypto-Assets\u201c, seit Ende Dezember 2024 vollständig anwendbar. Das weltweit erste umfassende Regelwerk für Kryptowerte in einem großen Wirtschaftsraum.","level_1_short_definition_en":"The EU regulation \u201cMarkets in Crypto-Assets\u201d, fully applicable since the end of December 2024. The world's first comprehensive framework for crypto assets across a major economic area.","ebene_2_vertiefung_de":"Vor MiCA galt in jedem Mitgliedstaat eigenes Recht oder gar keines. Die Verordnung verpflichtet Handelsplätze und Verwahrer zu einer Zulassung, Herausgeber von Token zu Angaben und Stablecoin-Anbieter zu nachweisbaren Rücklagen. Regulierung folgt hier einem bekannten Muster: erst entsteht eine neue Geldform, dann folgen Zusammenbrüche, dann die Regeln.","level_2_extended_en":"Before MiCA, each member state applied its own law or none at all. The regulation requires trading venues and custodians to obtain authorisation, token issuers to disclose information, and stablecoin providers to hold verifiable reserves. Regulation here follows a familiar pattern: first a new form of money emerges, then collapses follow, then the rules.","querverweise":"Verbraucherschutz; KYC","aktualisierung":"Jährlich prüfen"},{"nr":20,"gruppe":"Staat, Regeln, Risiken","begriff_de":"KYC","term_en":"KYC","ebene_1_kurzdefinition_de":"Kurz für \u201eKnow Your Customer\u201c. Die gesetzliche Pflicht von Banken und Handelsplätzen, die Identität ihrer Kundschaft festzustellen – gilt inzwischen auch für Kryptobörsen.","level_1_short_definition_en":"Short for \u201cknow your customer\u201d. The legal obligation of banks and trading venues to establish their customers' identity. It now applies to crypto exchanges as well.","ebene_2_vertiefung_de":"Wer bei einer regulierten Börse Euro in Kryptowerte tauscht, muss sich ausweisen. Damit entsteht die Verbindung zwischen einer Blockchain-Adresse und einer Person – jene Verbindung, die das System selbst nicht kennt.","level_2_extended_en":"Anyone exchanging euros for crypto assets at a regulated exchange must prove their identity. This creates the link between a blockchain address and a person – the very link the system itself does not hold.","querverweise":"Pseudonymität; Digitale Identität; Regulierung (MiCA)","aktualisierung":"Stabil"},{"nr":21,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Verbraucherschutz","term_en":"Consumer protection","ebene_1_kurzdefinition_de":"Regeln, die Anlegerinnen und Anleger vor Fehlinformation und Verlusten schützen sollen. Im Kryptomarkt greifen sie erst seit Kurzem und nicht überall.","level_1_short_definition_en":"Rules intended to protect investors from misinformation and loss. In the crypto market they have applied only recently, and not everywhere.","ebene_2_vertiefung_de":"Bei Bankeinlagen sichert in der EU eine gesetzliche Einlagensicherung Guthaben bis zu 100.000 Euro ab. Für Kryptowerte gilt das nicht. Außerhalb regulierter Plattformen bleibt die Verantwortung vollständig bei den Nutzenden.","level_2_extended_en":"For bank deposits, a statutory deposit guarantee in the EU covers balances up to 100,000 euros. This does not apply to crypto assets. Outside regulated platforms responsibility rests entirely with users.","querverweise":"Regulierung (MiCA); Rug Pull; DeFi","aktualisierung":"Jährlich prüfen"},{"nr":22,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Kriminalität","term_en":"Crime","ebene_1_kurzdefinition_de":"Kryptowerte werden auch für Betrug, Erpressung und Geldwäsche genutzt. Zugleich sind ihre Zahlungswege öffentlich einsehbar und dadurch nachverfolgbar.","level_1_short_definition_en":"Crypto assets are also used for fraud, extortion and money laundering. At the same time their payment trails are publicly visible and therefore traceable.","ebene_2_vertiefung_de":"Anders als bei Bargeld bleibt jede Zahlung dauerhaft dokumentiert. Mehrfach führten solche Spuren Jahre später zu Festnahmen und zur Sicherstellung großer Bestände.","level_2_extended_en":"Unlike cash, every payment remains permanently documented. Such trails have repeatedly led to arrests and the seizure of large holdings years later.","querverweise":"Pseudonymität; KYC; Verbraucherschutz","aktualisierung":"Jährlich prüfen"},{"nr":23,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Selbstverwahrung","term_en":"Self-custody","ebene_1_kurzdefinition_de":"Die eigenen Schlüssel selbst aufbewahren, statt sie einer Börse zu überlassen. Volle Kontrolle und volle Verantwortung – ein verlorener Schlüssel ist nicht zu ersetzen.","level_1_short_definition_en":"Keeping your own keys rather than leaving them with an exchange. Full control and full responsibility, since a lost key cannot be replaced.","ebene_2_vertiefung_de":"Selbstverwahrung ist der ursprünglich vorgesehene Zustand: Wer den privaten Schlüssel hält, verfügt über das Guthaben ohne Dritten. Die Kehrseite: Jeder Fehler ist endgültig. Verlust, Diebstahl oder ein vergessenes Passwort führen zum unwiederbringlichen Verlust.","level_2_extended_en":"Self-custody is the originally intended condition: whoever holds the private key controls the funds without asking a third party. The downside: every mistake is final. Loss, theft or a forgotten password leads to irretrievable loss.","querverweise":"Wallet; Kryptobörse; Vertrauen","aktualisierung":"Stabil"},{"nr":24,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Plattform-Geld","term_en":"Platform money","ebene_1_kurzdefinition_de":"Digitales Geld, das von Technologie- oder Zahlungsunternehmen herausgegeben wird und nur innerhalb ihrer Systeme gilt oder von ihnen verwaltet wird.","level_1_short_definition_en":"Digital money issued by technology or payment companies, valid only within their systems or administered by them.","ebene_2_vertiefung_de":"Guthaben in Bezahl-Apps, Punkte in Kundenprogrammen und unternehmenseigene Stablecoins folgen demselben Prinzip. Ein privates Unternehmen gibt ein Zahlungsmittel aus und legt dessen Regeln fest – und entscheidet, wer teilnehmen darf.","level_2_extended_en":"Balances in payment apps, points in loyalty programmes and corporate stablecoins all follow the same principle. A private company issues a means of payment and sets its rules – and decides who may take part.","querverweise":"Stablecoin; Technologische Souveränität","aktualisierung":"Jährlich prüfen"},{"nr":25,"gruppe":"Staat, Regeln, Risiken","begriff_de":"Energieverbrauch","term_en":"Energy consumption","ebene_1_kurzdefinition_de":"Das Bitcoin-Netzwerk verbraucht dauerhaft Strom, weil seine Sicherung auf fortlaufender Rechenarbeit beruht. Schätzungen bewegen sich in der Größenordnung des Verbrauchs mittelgroßer Staaten.","level_1_short_definition_en":"The Bitcoin network consumes electricity continuously, because its security rests on ongoing computational work. Estimates place it in the order of the consumption of medium-sized countries.","ebene_2_vertiefung_de":"Der Stromverbrauch ist kein Nebeneffekt, sondern Teil der Bauweise. Ethereum hat sein Sicherungsverfahren 2022 umgestellt und den Verbrauch um über 99 Prozent gesenkt.","level_2_extended_en":"Electricity consumption is not a side effect but part of the design. Ethereum changed its security method in 2022 and cut its consumption by more than 99 per cent.","querverweise":"Bitcoin","aktualisierung":"Jährlich prüfen"},{"nr":26,"gruppe":"Geldgeschichte","begriff_de":"Vertrauen","term_en":"Trust","ebene_1_kurzdefinition_de":"Die Grundlage jedes Geldes. Ein Schein ist bedrucktes Papier, eine Münze ein Stück Metall. Ihren Wert erhalten sie erst dadurch, dass andere sie ohne Fragen annehmen.","level_1_short_definition_en":"The basis of all money. A banknote is printed paper, a coin a piece of metal. They acquire value only because others accept them, no questions asked.","ebene_2_vertiefung_de":"Historisch stützte sich Vertrauen auf Verschiedenes: den Materialwert einer Münze, das Versprechen einer Bank, die Autorität eines Staates. Kryptowerte versuchen einen anderen Weg: Vertrauen soll aus überprüfbarer Mathematik und einem verteilten Netzwerk entstehen.","level_2_extended_en":"Historically, trust rested on various things: the material value of a coin, the promise of a bank, the authority of a state. Crypto assets attempt a different route: trust is meant to arise from verifiable mathematics and a distributed network.","querverweise":"Deckung; Blockchain","aktualisierung":"Stabil"},{"nr":27,"gruppe":"Geldgeschichte","begriff_de":"Deckung","term_en":"Backing","ebene_1_kurzdefinition_de":"Der Gegenwert, der ein Zahlungsmittel absichern soll. Etwa Edelmetall, eine Währungsreserve oder ein staatliches Versprechen. Fehlt sie, hängt der Wert allein an der Erwartung.","level_1_short_definition_en":"The counter-value intended to secure a means of payment. Precious metal, a currency reserve or a state promise. Without it, value rests on expectation alone.","ebene_2_vertiefung_de":"Schwedische Kupferplatten trugen ihren Wert im Material selbst. Das erste Papiergeld ersetzte dieses Prinzip durch das Versprechen der Einlösbarkeit. Stablecoins wiederholen diese Frage in digitaler Form.","level_2_extended_en":"Swedish copper plates carried their value in the material itself. The first paper money replaced this with a promise of redemption. Stablecoins repeat this question in digital form.","querverweise":"Stablecoin; Vertrauen","aktualisierung":"Stabil"},{"nr":28,"gruppe":"Geldgeschichte","begriff_de":"Bank Run","term_en":"Bank run","ebene_1_kurzdefinition_de":"Wenn viele gleichzeitig ihr Geld abheben wollen, weil sie einer Bank nicht mehr trauen. Da nie alle Einlagen zugleich verfügbar sind, kann schon die Sorge den Zusammenbruch auslösen.","level_1_short_definition_en":"When many people try to withdraw their money at once because they no longer trust a bank. Since not all deposits are available simultaneously, the fear alone can trigger a collapse.","ebene_2_vertiefung_de":"Die Stockholms Banco erlebte diesen Vorgang 1668. Im Kryptomarkt wiederholte sich das Muster 2022 beim Zusammenbruch von Terra/UST und der Börse FTX.","level_2_extended_en":"The Stockholms Banco experienced this in 1668. In the crypto market the pattern repeated in 2022 with the collapse of Terra/UST and of the FTX exchange.","querverweise":"Deckung; Verbraucherschutz","aktualisierung":"Stabil"},{"nr":29,"gruppe":"Geldgeschichte","begriff_de":"Gesetzliches Zahlungsmittel","term_en":"Legal tender","ebene_1_kurzdefinition_de":"Das Zahlungsmittel, das per Gesetz zur Begleichung von Schulden angenommen werden muss. In der Eurozone ist das der Euro.","level_1_short_definition_en":"The means of payment that must by law be accepted to settle debts. In the euro zone, this is the euro.","ebene_2_vertiefung_de":"Kryptowerte besitzen diesen Status in der EU nicht. El Salvador führte 2021 Bitcoin als gesetzliches Zahlungsmittel ein und schränkte diesen Status 2025 wieder ein. Der geplante digitale Euro soll den Status erhalten.","level_2_extended_en":"Crypto assets do not hold this status in the EU. El Salvador introduced bitcoin as legal tender in 2021 but scaled it back in 2025. The planned digital euro is intended to receive the status.","querverweise":"Digitaler Euro; Kryptowährung","aktualisierung":"Jährlich prüfen"},{"nr":30,"gruppe":"Zukunft","begriff_de":"Quantencomputing","term_en":"Quantum computing","ebene_1_kurzdefinition_de":"Computer, die nach den Regeln der Quantenphysik rechnen. Sie könnten künftig Verschlüsselungen knacken, die heute als sicher gelten – auch jene, die Krypto-Guthaben schützen.","level_1_short_definition_en":"Computers that calculate according to the laws of quantum physics. In future they could break forms of encryption considered secure today, including those protecting crypto holdings.","ebene_2_vertiefung_de":"Ein ausreichend leistungsfähiger Quantencomputer könnte private Schlüssel aus öffentlich sichtbaren Daten berechnen. Für diesen Zeitpunkt gibt es bereits einen Namen: Q-Day. Eine Studie von Google Quantum AI schätzte 2026, dass weniger Rechenleistung nötig wäre als bisher angenommen.","level_2_extended_en":"A sufficiently powerful quantum computer could calculate private keys from publicly visible data. There is already a name for that moment: Q-Day. A 2026 study by Google Quantum AI estimated that less computing power would be needed than previously assumed.","querverweise":"Post-Quanten-Kryptografie","aktualisierung":"Jährlich prüfen"},{"nr":31,"gruppe":"Zukunft","begriff_de":"Post-Quanten-Kryptografie","term_en":"Post-quantum cryptography","ebene_1_kurzdefinition_de":"Neue Verschlüsselungsverfahren, die auch Quantencomputern standhalten sollen. Die Antwort auf eine Bedrohung, die es noch nicht gibt – auf die man sich aber früh vorbereiten muss.","level_1_short_definition_en":"New encryption methods designed to withstand quantum computers. An answer to a threat that does not yet exist – but one that requires early preparation.","ebene_2_vertiefung_de":"Verschlüsselung lässt sich nicht über Nacht austauschen. Die US-Normungsbehörde NIST veröffentlichte 2024 erste quantensichere Verfahren. Bei Bitcoin ist die Umstellung besonders schwierig, weil keine zentrale Stelle sie anordnen kann.","level_2_extended_en":"Encryption cannot be swapped overnight. The US standards body NIST published its first quantum-safe methods in 2024. For Bitcoin the transition is particularly difficult because there is no central authority to order it.","querverweise":"Quantencomputing; Blockchain","aktualisierung":"Jährlich prüfen"},{"nr":32,"gruppe":"Zukunft","begriff_de":"Technologische Konvergenz","term_en":"Technological convergence","ebene_1_kurzdefinition_de":"Das Zusammenwachsen bisher getrennter Technologien. Blockchain, Künstliche Intelligenz und Quantentechnik entwickeln sich derzeit aufeinander zu und verstärken sich gegenseitig.","level_1_short_definition_en":"The merging of previously separate technologies. Blockchain, artificial intelligence and quantum technology are currently converging and reinforcing one another.","ebene_2_vertiefung_de":"Ein Fraunhofer-FKIE-Whitepaper (2026) argumentiert, dass das kommende Jahrzehnt weniger von einer einzelnen Erfindung geprägt sein dürfte als von den Schnittstellen zwischen KI, Blockchain und Quantentechnik.","level_2_extended_en":"A Fraunhofer FKIE whitepaper (2026) argues that the coming decade is likely to be shaped less by any single invention than by the interfaces between AI, blockchain and quantum technology.","querverweise":"Agent Payments; Quantencomputing","aktualisierung":"Stabil"},{"nr":33,"gruppe":"Zukunft","begriff_de":"Agent Payments","term_en":"Agent payments","ebene_1_kurzdefinition_de":"Zahlungen, die KI-Assistenten selbstständig für ihre Nutzer auslösen. Bezahlt wird meist in Stablecoins über Krypto-Wallets, denn Software kann kein Bankkonto eröffnen.","level_1_short_definition_en":"Payments initiated autonomously by AI assistants on behalf of their users. Settlement usually happens in stablecoins via crypto wallets, because software cannot open a bank account.","ebene_2_vertiefung_de":"Binnen eines Jahres führten Agenten rund 176 Millionen Blockchain-Transaktionen mit über 73 Millionen US-Dollar aus (2026) – Tendenz stark steigend. Fast alle Zahlungen laufen über Stablecoins.","level_2_extended_en":"Within a single year, agents carried out around 176 million blockchain transactions worth more than 73 million US dollars (2026) – and the numbers are rising fast. Almost all payments run on stablecoins.","querverweise":"Digitale Identität; Stablecoin; Technologische Konvergenz","aktualisierung":"Jährlich aktualisieren"},{"nr":34,"gruppe":"Zukunft","begriff_de":"Programmierbares Geld","term_en":"Programmable money","ebene_1_kurzdefinition_de":"Geld, dessen Verwendung an Regeln geknüpft ist: nur für bestimmte Zwecke, nur bis zu einem Stichtag, nur an bestimmte Empfänger. Die Regel steckt im Geld selbst.","level_1_short_definition_en":"Money whose use is tied to rules: only for certain purposes, only until a deadline, only to certain recipients. The rule is embedded in the money itself.","ebene_2_vertiefung_de":"Smart Contracts machen das möglich: Programme, die eine Zahlung automatisch auslösen, sobald eine Bedingung erfüllt ist. Das wirft eine Frage auf, die alle Geldformen betrifft: Wer legt die Regeln fest?","level_2_extended_en":"Smart contracts make this possible: programs that trigger a payment automatically once a condition is met. But it raises a question relevant to all forms of money: who sets the rules?","querverweise":"Digitaler Euro; Smart Contract; Agent Payments","aktualisierung":"Stabil"},{"nr":35,"gruppe":"Zukunft","begriff_de":"Digitale Identität","term_en":"Digital identity","ebene_1_kurzdefinition_de":"Der Nachweis, wer man im Netz ist. Beim Bezahlen entscheidend.","level_1_short_definition_en":"Proof of who you are online. Crucial when paying.","ebene_2_vertiefung_de":"Banken verlangen Ausweise, Software erfüllt das nicht. In Krypto-Systemen genügt ein Schlüssel statt eines Namens. Das ermöglicht Zahlungen, für die niemand geradesteht – an dieser Lücke arbeiten Gesetzgeber weltweit.","level_2_extended_en":"Banks require ID documents, software meets none of these criteria. In crypto systems a key suffices instead of a name. This enables payments for which nobody is accountable – legislators worldwide are working on this gap.","querverweise":"Agent Payments; KYC; Pseudonymität","aktualisierung":"Jährlich prüfen"},{"nr":36,"gruppe":"Zukunft","begriff_de":"Technologische Souveränität","term_en":"Technological sovereignty","ebene_1_kurzdefinition_de":"Die Fähigkeit eines Staates oder einer Region, über die eigenen Schlüsseltechnologien selbst zu bestimmen, statt von fremden Anbietern abhängig zu sein.","level_1_short_definition_en":"The ability of a state or region to determine its own key technologies rather than depending on foreign providers.","ebene_2_vertiefung_de":"Bezahlsysteme sind Infrastruktur. Die meisten Stablecoins sind an den US-Dollar gekoppelt, die großen Konzerne sitzen außerhalb Europas. Der digitale Euro ist auch eine Antwort auf diese Sorge.","level_2_extended_en":"Payment systems are infrastructure. Most stablecoins are pegged to the US dollar, and the major corporations are based outside Europe. The digital euro is, among other things, an answer to this concern.","querverweise":"Digitaler Euro; Stablecoin; Technologische Konvergenz","aktualisierung":"Stabil"},{"nr":37,"gruppe":"Zukunft","begriff_de":"Tokenisierung von Realwerten","term_en":"Tokenisation of real assets","ebene_1_kurzdefinition_de":"Reale Werte wie Immobilien, Kunst oder Unternehmensanteile werden in digitale Anteile zerlegt und handelbar gemacht. Ein Gemälde bekommt hundert Eigentümer.","level_1_short_definition_en":"Real assets such as property, art or company shares are divided into digital units and made tradable. A painting acquires a hundred owners.","ebene_2_vertiefung_de":"Ist mit dem Token kein Recht oder keine Nutzung verbunden, beruht sein Wert allein darauf, dass andere bereit sind, dafür zu bezahlen.","level_2_extended_en":"If the token provides no rights or practical benefits, its value depends entirely on other people's willingness to pay for it.","querverweise":"Token / Coin; Spekulation","aktualisierung":"Stabil"},{"nr":38,"gruppe":"Zukunft","begriff_de":"Digitaler Euro","term_en":"Digital Euro","ebene_1_kurzdefinition_de":"Digitales Bargeld der Europäischen Zentralbank – geplant, aber noch nicht eingeführt. Soll neben Bar- und Giralgeld stehen und Zahlungen ohne Konto bei privaten Anbietern ermöglichen.","level_1_short_definition_en":"Digital cash issued by the European Central Bank; planned but not yet introduced. Would exist alongside cash and bank money, enabling payments without an account at a private provider.","ebene_2_vertiefung_de":"Die EZB will für eine mögliche erste Ausgabe im Jahr 2029 bereit sein. Anders als Bitcoin wäre der digitale Euro staatliches Geld in neuer Form – kein Gegenentwurf zum Staat, sondern sein Instrument.","level_2_extended_en":"The ECB aims to be ready for a possible first issuance in 2029. Unlike Bitcoin, the digital euro would be state money in a new form – not a counter-model to the state but its instrument.","querverweise":"Technologische Souveränität; Programmierbares Geld","aktualisierung":"Halbjährlich prüfen"}];

    // Karten positionieren: gleichmäßig über den Viewport verteilt
    const total = data.length;
    const cols  = Math.ceil(Math.sqrt(total * (window.innerWidth / window.innerHeight) * 1.1));
    const rows  = Math.ceil(total / cols);

    data.forEach((item, i) => {
        const col   = i % cols;
        const row   = Math.floor(i / cols);
        const xPct = (col / cols * 86 + 2).toFixed(1);
        const yPct = (row / rows * 76 + 4).toFixed(1);
        const borderColor = GROUP_BORDER_COLORS[item.gruppe] || DEFAULT_BORDER;
        const cardId = resolveReferenceKey(item.begriff_de || item.term_en || `card-${i + 1}`);

        const hasV = !!(item.ebene_2_vertiefung_de || item.level_2_extended_en);

        const card = document.createElement('div');
        card.className = 'card';
        card.style.cssText = `left:${xPct}vw;top:${yPct}vh;border-color:${borderColor};`;
        card.dataset.id = cardId;
        card.dataset.links = (item.querverweise || '')
            .split(';')
            .map(value => resolveReferenceKey(value.trim()))
            .filter(Boolean)
            .join(',');

        // data-title / data-text für script.js Kompatibilität (Deutsch als Standard)
        card.dataset.title = item.begriff_de || '';
        card.dataset.text  = item.ebene_1_kurzdefinition_de || '';

        // Alle Sprachvarianten als data-Attribute
        card.dataset.termDe       = item.begriff_de || '';
        card.dataset.termEn       = item.term_en || '';
        card.dataset.kurzDe       = item.ebene_1_kurzdefinition_de || '';
        card.dataset.kurzEn       = item.level_1_short_definition_en || '';
        card.dataset.vertiefungDe = item.ebene_2_vertiefung_de || '';
        card.dataset.vertiefungEn = item.level_2_extended_en || '';
        card.dataset.gruppe       = item.gruppe || '';

        card.innerHTML = `
            <span class="card-symbol">${item.begriff_de || ''}</span>
            <div class="card-content">
                <div class="card-title-row">
                    <div>
                        <p class="card-gruppe">${item.gruppe || ''}</p>
                        <h2 class="card-title">${item.begriff_de || ''}</h2>
                    </div>
                    <div class="card-controls">
                        <button class="card-lang-btn" type="button">EN</button>
                        <button class="card-close" type="button" aria-label="Schliessen">×</button>
                    </div>
                </div>
                <p class="card-text">${item.ebene_1_kurzdefinition_de || ''}</p>
                ${hasV ? `
                <button class="card-vertiefung-btn" type="button">▶ Vertiefung</button>
                <div class="card-vertiefung-wrap" hidden>
                    <p class="card-vertiefung-text">${item.ebene_2_vertiefung_de || ''}</p>
                </div>` : ''}
            </div>`;

        stage.insertBefore(card, hint);
        cardItems.push({ el: card, item });
    });

    // script.js NACH dem Erstellen der Karten laden (findet dann alle .card-Elemente)
    await new Promise(resolve => {
        const s = document.createElement('script');
        s.src = 'script.js';
        s.onload = resolve;
        document.body.appendChild(s);
    });

    // In dieser Variante: offene Karten sollen weiter frei verschiebbar sein.
    window.ALLOW_DRAG_OPEN_CARDS = true;

    // In dieser Variante: keine Sticky-Ziele, damit verbundene Karten frei treiben.
    window.computeStickyTargets = function () { return new Map(); };

    window.addEventListener('resize', () => {
        applyDisplayScale();
    });

    // Verbindungslinien beim Klick (einfarbig, nur bei offener Karte)
    (function () {
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;';
        stage.insertBefore(svg, stage.firstChild);

        const allCards = cardItems.map(entry => entry.el);
        const cardById = new Map();
        allCards.forEach(card => {
            if (card.dataset.id) {
                cardById.set(card.dataset.id, card);
            }
        });

        const openLineCards = new Set();
        const openLineTargets = new Map();

        function getLinkedCards(card) {
            const baseId = card.dataset.id;
            const linked = new Set();

            (card.dataset.links || '')
                .split(',')
                .map(value => value.trim())
                .filter(Boolean)
                .forEach(id => {
                    const target = cardById.get(id);
                    if (target && target !== card) {
                        linked.add(target);
                    }
                });

            allCards.forEach(other => {
                if (other === card) return;
                const reverseLinks = (other.dataset.links || '')
                    .split(',')
                    .map(value => value.trim())
                    .filter(Boolean);

                if (reverseLinks.includes(baseId)) {
                    linked.add(other);
                }
            });

            return Array.from(linked);
        }

        function centerOf(element) {
            const rect = element.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            return {
                x: rect.left - stageRect.left + (rect.width / 2),
                y: rect.top - stageRect.top + (rect.height / 2)
            };
        }

        function hideLines(card) {
            openLineCards.delete(card);
            openLineTargets.delete(card);
        }

        function showLines(card) {
            openLineCards.add(card);
            openLineTargets.set(card, getLinkedCards(card));
        }

        const originalOpenCard = window.openCard;
        const originalCloseCard = window.closeCard;

        window.openCard = function (card) {
            originalOpenCard(card);
            showLines(card);
        };

        window.closeCard = function (card) {
            originalCloseCard(card);
            hideLines(card);
        };

        function updateLines() {
            svg.replaceChildren();

            openLineCards.forEach(card => {
                if (!card.classList.contains('open')) {
                    openLineCards.delete(card);
                    openLineTargets.delete(card);
                    return;
                }

                const source = centerOf(card);
                const targets = openLineTargets.get(card) || [];
                targets.forEach(target => {
                    const destination = centerOf(target);
                    const line = document.createElementNS(svgNS, 'line');
                    line.setAttribute('stroke', 'rgba(255,255,255,0.45)');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('stroke-linecap', 'round');
                    line.setAttribute('x1', source.x);
                    line.setAttribute('y1', source.y);
                    line.setAttribute('x2', destination.x);
                    line.setAttribute('y2', destination.y);
                    svg.appendChild(line);
                });
            });

            requestAnimationFrame(updateLines);
        }

        requestAnimationFrame(updateLines);
    })();

    // Vertiefung-Buttons: Klick aufklappen/zuklappen
    stage.querySelectorAll('.card-vertiefung-btn').forEach(btn => {
        btn.addEventListener('pointerdown', e => e.stopPropagation());
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const wrap = btn.nextElementSibling;
            wrap.hidden = !wrap.hidden;
            // Label je nach aktueller Kartensprache
            const card = btn.closest('.card');
            const de = card.querySelector('.card-lang-btn').textContent === 'EN';
            btn.textContent = wrap.hidden
                ? (de ? '▶ Vertiefung' : '▶ Read more')
                : (de ? '▼ Vertiefung schließen' : '▼ Close detail');
        });
    });

    // Sprache einer einzelnen Karte umschalten
    function applyCardLang(card, item, lang) {
        const de = lang === 'de';
        const term       = de ? item.begriff_de               : item.term_en;
        const kurz       = de ? item.ebene_1_kurzdefinition_de : item.level_1_short_definition_en;
        const vertiefung = de ? (item.ebene_2_vertiefung_de || '') : (item.level_2_extended_en || '');

        card.querySelector('.card-symbol').textContent = term || '';
        card.querySelector('.card-title').textContent  = term || '';
        card.querySelector('.card-text').textContent   = kurz || '';

        const vtText = card.querySelector('.card-vertiefung-text');
        if (vtText) vtText.textContent = vertiefung;

        const vtBtn = card.querySelector('.card-vertiefung-btn');
        if (vtBtn) {
            const wrap = vtBtn.nextElementSibling;
            vtBtn.textContent = wrap && !wrap.hidden
                ? (de ? '▼ Vertiefung schließen' : '▼ Close detail')
                : (de ? '▶ Vertiefung'           : '▶ Read more');
        }

        const langBtn = card.querySelector('.card-lang-btn');
        if (langBtn) langBtn.textContent = de ? 'EN' : 'DE';
    }

    // Sprach-Toggle je Karte
    cardItems.forEach(({ el: card, item }) => {
        const langBtn = card.querySelector('.card-lang-btn');
        if (!langBtn) return;
        langBtn.addEventListener('pointerdown', e => e.stopPropagation());
        langBtn.addEventListener('click', e => {
            e.stopPropagation();
            const newLang = langBtn.textContent === 'EN' ? 'en' : 'de';
            applyCardLang(card, item, newLang);
        });
    });

})();
</script>

</body>
</html>

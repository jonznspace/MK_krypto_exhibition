<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 10 · Firmengeld</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="station-09.bundle.css?v=2">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 12 – Firmengeld">

    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 10 - Firmengeld">
        <span class="station-marker__station">Station 10</span>
        <span class="station-marker__topic">Firmengeld</span>
      </div>

      <div class="start-copy">
        <span class="eyebrow" id="startEyebrow"></span>
        <h1 class="title title--hero" id="startTitle"></h1>
        <div class="hero-text" id="startIntro" tabindex="0" aria-label="Einführungstext zur Station"></div>
      </div>

      <div class="start-visual" aria-hidden="true">
        <img class="station-image" id="startImage" alt="">
      </div>

      <div class="start-actions">
        <button class="cta" id="btnDeepen" type="button">
          <span class="cta-label">Vertiefung</span>
          <span class="cta-icon"><img src="../../00_design-system/symbols/bulb.svg" alt=""></span>
        </button>
      </div>

      <div class="overlay" id="overlay" aria-hidden="true">
        <div class="ov-card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
          <button class="ov-close" id="ovClose" aria-label="Schließen" type="button">✕</button>
          <span class="ov-tag" id="ovTag"></span>
          <h2 id="ovTitle"></h2>
          <div id="ovBody"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="station-09.bundle.js?v=2" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 7 · Wie funktioniert Bitcoin?</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="station-08.css">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 7 – Wie funktioniert Bitcoin?">

    <section class="screen screen-action" id="screenAction">
      <header class="action-hdr">
        <div class="action-hdr-copy">
          <span class="eyebrow" id="actionEyebrow"></span>
          <h1 class="title title--compact" id="actionTitle"></h1>
        </div>
        <button class="close-btn" id="btnClose" aria-label="Schließen" type="button">✕</button>
      </header>

      <div class="tabs" role="tablist" aria-label="Stationsthemen">
        <button class="tab active" id="tabModuleA" type="button" role="tab" aria-selected="true" aria-controls="moduleA">Wie funktioniert Bitcoin?</button>
        <button class="tab" id="tabModuleB" type="button" role="tab" aria-selected="false" aria-controls="moduleB">Geräte</button>
      </div>

      <div class="module-panel" id="moduleA" role="tabpanel" aria-labelledby="tabModuleA">
        <div class="article-copy" id="bitcoinContent"></div>
        <div class="deepdive-list" id="deepdiveList" aria-label="Vertiefungen"></div>
      </div>
      <div class="module-panel hidden" id="moduleB" role="tabpanel" aria-labelledby="tabModuleB">
        <div class="article-copy" id="devicesContent"></div>
        <div class="deepdive-list" id="deviceDeepdiveList" aria-label="Vertiefungen zu Geräten"></div>
      </div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="base.js" defer></script>
<script src="station-08.js" defer></script>
</body>
</html>

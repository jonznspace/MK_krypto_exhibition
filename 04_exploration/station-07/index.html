<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 5 · Wie funktioniert Bitcoin?</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-offcanvas.css">
<link rel="stylesheet" href="station-07.css?v=2">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="../../shared/css/station-idle-reload.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 5 – Wie funktioniert Bitcoin?">

    <section class="screen screen-main" id="screenMain">
      <div class="station-marker" aria-label="Station 5 - Wie funktioniert Bitcoin?">
        <span class="station-marker__station">Station 5</span>
        <span class="station-marker__topic">Wie funktioniert Bitcoin?</span>
      </div>
      <header class="main-hdr">
        <h1 class="title title--hero" id="actionTitle"></h1>
      </header>

      <div class="tabs" role="tablist" aria-label="Stationsthemen">
        <button class="tab active" id="tabModuleA" type="button" role="tab" aria-selected="true" aria-controls="moduleA">Wie funktioniert Bitcoin?</button>
        <button class="tab" id="tabModuleB" type="button" role="tab" aria-selected="false" aria-controls="moduleB">Mining-Geräte</button>
      </div>

      <div class="module-panel" id="moduleA" role="tabpanel" aria-labelledby="tabModuleA">
        <div class="module-scroller">
          <div class="article-copy" id="bitcoinContent"></div>
        </div>
        <div class="station-offcanvas__scrollbar" aria-hidden="true"><div class="station-offcanvas__scrollbar-thumb"></div></div>
      </div>
      <div class="module-panel hidden" id="moduleB" role="tabpanel" aria-labelledby="tabModuleB">
        <div class="module-scroller">
          <div class="article-copy" id="devicesContent"></div>
        </div>
        <div class="station-offcanvas__scrollbar" aria-hidden="true"><div class="station-offcanvas__scrollbar-thumb"></div></div>
      </div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="../../shared/js/station-idle-reload.js"></script>
<script src="../../shared/js/station-offcanvas.js"></script>
<script src="station-07.bundle.js?v=8" defer></script>
</body>
</html>

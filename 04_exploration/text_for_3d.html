<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang SVG Schriftzuege</title>
    <style>
        @font-face {
            font-family: "Panchang";
            src: url("../00_design-system/fonts/panchang/Panchang-Variable.woff2") format("woff2");
            font-weight: 200 800;
        }

        :root {
            --ink: #11110f;
            --paper: #f4f0e8;
            --signal: #d4ff38;
            --rule: #c8c2b5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background-color: var(--paper);
            background-image: linear-gradient(rgba(17, 17, 15, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(17, 17, 15, .045) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: Arial, sans-serif;
        }

        main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        h1 { margin: 0; font: 700 24px/1 "Panchang", sans-serif; letter-spacing: 0; }
        header p, .meta { margin: 0; font: 11px/1.3 "Courier New", monospace; text-transform: uppercase; }

        .wordmarks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

        article {
            min-height: 420px;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--ink);
            background: var(--paper);
        }

        .preview {
            min-height: 312px;
            display: grid;
            place-items: center;
            padding: 32px;
            border-bottom: 2px solid var(--ink);
            overflow: hidden;
        }

        .wordmark {
            margin: 0;
            text-align: center;
            font-family: "Panchang", sans-serif;
            font-size: clamp(40px, 7vw, 90px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            word-break: break-word;
        }

        .details { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px; }
        .details h2 { margin: 0 0 4px; font: 700 16px/1 "Panchang", sans-serif; }
        .download {
            flex: 0 0 auto;
            border: 2px solid var(--ink);
            border-radius: 0;
            padding: 11px 14px;
            color: var(--ink);
            background: var(--signal);
            font: 700 11px/1 "Courier New", monospace;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
        }
        .download:hover, .download:focus-visible { background: var(--ink); color: var(--signal); outline: none; }

        footer { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); font: 11px/1.4 "Courier New", monospace; }

        @media (max-width: 700px) {
            main { padding: 20px 16px 32px; }
            header { align-items: flex-start; flex-direction: column; gap: 10px; }
            .wordmarks { grid-template-columns: 1fr; }
            article { min-height: 330px; }
            .preview { min-height: 230px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Schriftzuege / SVG</h1>
            <p>Panchang Variable / 700</p>
        </header>

        <section class="wordmarks" aria-label="SVG-Schriftzuege">
            <article>
                <div class="preview"><p class="wordmark">KRYPTO, WAS?</p></div>
                <div class="details">
                    <div><h2>KRYPTO, WAS?</h2><p class="meta">Panchang / vector paths</p></div>
                    <a class="download" href="krypto-was-panchang.svg" download>SVG laden</a>
                </div>
            </article>
            <article>
                <div class="preview"><p class="wordmark">MÜNZKABINETT SKD</p></div>
                <div class="details">
                    <div><h2>MÜNZKABINETT SKD</h2><p class="meta">Panchang / vector paths</p></div>
                    <a class="download" href="muenzkabinett-skd-panchang.svg" download>SVG laden</a>
                </div>
            </article>
        </section>

        <footer>Die SVGs enthalten Panchang als echte Vektorpfade und funktionieren deshalb unabhaengig von installierten Schriften.</footer>
    </main>
</body>
</html>

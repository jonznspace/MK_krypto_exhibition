<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Station 1 · Kryptografie</title>
    <link rel="stylesheet" href="../../00_design-system/tokens/tokens.css" />
    <link rel="stylesheet" href="station-01.css?v=3" />
    <link
      rel="stylesheet"
      href="../../shared/css/station-language-switch.css"
    />
    <link rel="stylesheet" href="../../shared/css/station-idle-reload.css" />
    <!-- Lokale Gestaltung der Optimierung, nach allen Original-Styles geladen. -->
    <link rel="stylesheet" href="optimization.css?v=12" />
  </head>
  <body class="station-optimization">
    <div id="scaler">
      <main id="frame" aria-label="Station 1 – Kryptografie">
        <section class="screen screen-start" id="screenStart">
          <div class="station-marker" aria-label="Station 1 - Kryptografie">
            <span class="station-marker__station">Station 1</span>
            <span class="station-marker__topic">Kryptografie</span>
          </div>

          <div class="start-copy">
            <span class="eyebrow" id="startEyebrow"></span>
            <h1 class="title title--hero" id="startTitle"></h1>
            <div class="hero-summary">
              <div
                class="hero-text"
                id="startIntro"
                aria-label="Einführungstext zur Station"
              ></div>
              <button
                class="reading-button"
                id="btnReadMore"
                type="button"
                aria-haspopup="dialog"
                aria-controls="readingOverlay"
              >
                Weiterlesen
              </button>
            </div>
          </div>

          <div class="start-visual" aria-hidden="true">
            <img class="station-image" id="startImage" alt="" />
          </div>

          <button class="cta" id="btnTry" type="button">
            <span class="cta-label" id="tryLabel"></span>
            <span class="cta-icon">
              <img
                src="../../00_design-system/symbols/brand-apple-arcade.svg"
                alt=""
              />
            </span>
          </button>
        </section>

        <section class="screen screen-action hidden" id="screenAction">
          <header class="action-hdr">
            <div class="action-hdr-copy">
              <span class="eyebrow" id="actionEyebrow"></span>
              <h1 class="title title--compact" id="actionTitle"></h1>
            </div>
            <button
              class="close-btn"
              id="btnClose"
              aria-label="Schließen"
              type="button"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </header>

          <div class="action-layout">
            <section
              class="skytale-stage"
              id="skyStage"
              aria-label="Interaktive Skytale"
            >
              <div
                class="skytale-canvas"
                id="skyCanvas"
                aria-label="Drehbares Modell einer Skytale"
              ></div>
              <span class="skytale-stage__instruction">Ziehen zum Drehen</span>
              <span class="skytale-stage__state" id="skyStageState"
                >Gewickelt · lesbar längs des Stabs</span
              >
            </section>

            <section class="skytale-controls">
              <span class="template-tag">Zum Ausprobieren</span>
              <div class="tabs" role="tablist" aria-label="Arbeitsmodus">
                <button
                  class="tab active"
                  id="btnEncrypt"
                  type="button"
                  role="tab"
                  aria-selected="true"
                >
                  Verschlüsseln
                </button>
                <button
                  class="tab"
                  id="btnDecrypt"
                  type="button"
                  role="tab"
                  aria-selected="false"
                >
                  Entschlüsseln
                </button>
              </div>

              <label class="field-label" for="skyIn" id="skyInLabel"
                >Lesbare Nachricht</label
              >
              <input
                class="field-input"
                type="text"
                id="skyIn"
                maxlength="36"
                autocomplete="off"
              />

              <div
                class="skytale-keyboard hidden"
                id="skyKeyboard"
                aria-label="Bildschirmtastatur"
              >
                <div class="keyboard-row" id="keyboardRowA"></div>
                <div class="keyboard-row" id="keyboardRowB"></div>
                <div
                  class="keyboard-row keyboard-row--bottom"
                  id="keyboardRowC"
                ></div>
                <div class="keyboard-row keyboard-row--actions">
                  <button
                    class="keyboard-key keyboard-key--wide"
                    id="btnKeyboardSpace"
                    type="button"
                  >
                    Leerzeichen
                  </button>
                  <button
                    class="keyboard-key keyboard-key--wide"
                    id="btnKeyboardBackspace"
                    type="button"
                  >
                    Löschen
                  </button>
                  <button
                    class="keyboard-key keyboard-key--wide"
                    id="btnKeyboardDone"
                    type="button"
                  >
                    Fertig
                  </button>
                </div>
              </div>

              <label class="field-label" for="skyCols" id="skyColsLabel"
                >Stabdurchmesser (Wicklungen): <b id="skyColsVal">5</b></label
              >
              <input type="range" id="skyCols" min="2" max="7" value="5" />

              <div class="skytale-actions">
                <button class="wrap-button" id="btnWrap" type="button">
                  Streifen abwickeln
                </button>
                <button
                  class="read-button"
                  id="btnReadDirection"
                  type="button"
                  aria-pressed="true"
                >
                  Leserichtung
                </button>
              </div>

              <div class="io-block">
                <span class="field-label" id="skyOutLabel"
                  >Abgewickelter Geheimtext</span
                >
                <div class="hashline" id="skyOut">...</div>
                <button
                  class="next-puzzle hidden"
                  id="btnNextPuzzle"
                  type="button"
                >
                  Nächste Skytale
                </button>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="reading-overlay" id="readingOverlay" hidden>
      <section
        class="reading-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="readingTitle"
      >
        <header class="reading-header">
          <div>
            <p class="reading-eyebrow" id="readingEyebrow">Hintergrund</p>
            <h2 id="readingTitle">Verschlüsseln &amp; Versiegeln</h2>
          </div>
          <button
            class="reading-close"
            id="btnCloseReading"
            type="button"
            aria-label="Schließen"
            title="Schließen"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        </header>
        <div
          class="reading-body"
          id="readingBody"
          tabindex="0"
          role="region"
          aria-label="Vollständiger Einführungstext"
        ></div>
      </section>
    </div>

    <script src="../../shared/js/vendor/three.min.js"></script>
    <script src="../../shared/js/station-language-switch.js"></script>
    <script src="../../shared/js/station-idle-reload.js"></script>
    <script src="station-01.js?v=14"></script>
  </body>
</html>

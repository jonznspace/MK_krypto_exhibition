<title>Wie funktioniert Bitcoin? · Erklärfilm</title>

<script>
/* =====================================================================
   SCRIPT: Die Zeitachse des Films.
   Das ist die einzige Stelle, an der Zeiten, Texte und Stehzeiten
   geändert werden. Alles darunter (Engine, Bühne) bleibt unverändert.

   Zeiten in Sekunden ab Filmstart. Kapitel laufen nahtlos ineinander,
   nach dem letzten Kapitel beginnt der Film wieder bei 0.

   Kapitel:
     id        Nummer (1 bis 4), steuert die Fortschrittsanzeige
     title     Kapiteltitel, erscheint zu Beginn des Kapitels
     start     Startzeit in Sekunden
     duration  Kapiteldauer in Sekunden (Soll laut Konzept)
               Der Kapiteltitel steht das ganze Kapitel über und blendet
               am Kapitelende aus.

   Cues (Aktionen), jede Zeile ein Ereignis:
     t        Startzeit in Sekunden
     ch       Kapitelnummer, zu der der Cue gehört
     name     Kürzel, wird im Dev-Modus im Bild angezeigt
     action   was passiert (siehe Liste)
     hold     Stehzeit in Sekunden (bei text und term)
     dur      Dauer: bei point, camera, type, rewrite in Sekunden;
              bei show/hide ein Dauer-Token ("d1" bis "d6") oder 0 = sofort,
              Standard ist "d6"

   Aktionen:
     text     Textzeile unten mittig.   text, hold
     term     Begriffskarte, blau.      term, text, anchor (left|mid|right), hold
     show     Element einblenden.       target (siehe Liste unten), dur
     hide     Element ausblenden.       target, dur
     dim      Element auf 40 % dimmen.  target (dimmed-opacity, duration-4)
     undim    Element zurück auf 100 %. target
     move     Element verschieben.      target, to: {x, y} (Versatz zur Grundposition), dur (Sekunden), linear
     draw     Linie zeichnet sich.      target, dur (Sekunden), linear
     type     Text schreibt sich.       target, text, dur (Sekunden)
     rewrite  Text schreibt sich um.    target, from, to, dur (Sekunden)
     point    Transaktionspunkt fährt.  from, to (left|mid|right|wait, eine Zahl = x auf der Fahrbahn,
              oder {x, y}), dur (Sekunden), linear
     camera   Kamera auf die Karte.     to: {scale, x, y}, dur (Sekunden). scale höchstens 1.

   Targets (Elemente der Karte und der Kapitel):
     map, zoneLeft, zoneMid, zoneRight, rail, point, entry (neuer
     Eintrag auf allen Kopien), slipEntry (Zeile auf dem Zettel links)
     Kapitel 1: k1Carola, k1Albert, k1Phone, k1PhoneLabel, k1List,
     k1ListLine, k1Bank
     Kapitel 2: privateKey (Schlüssel links, beweglich), k2Engraving,
     k2Wallet, k2Signature, k2PublicKey, k2Check, k2Link, waitArea
   ===================================================================== */
const SCRIPT = {
  fps: 25,
  chapters: [
    { id: 1, title: "Kein Zentrum",                        start: 0,   duration: 45 },
    { id: 2, title: "Wie funktioniert eine Transaktion?",  start: 45,  duration: 40 },
    { id: 3, title: "Wie funktioniert Mining?",            start: 85,  duration: 50 },
    { id: 4, title: "Wie ist die Blockchain abgesichert?", start: 135, duration: 50 },
  ],
  cues: [
    /* =================== Kapitel 1: Kein Zentrum (0 bis 45) =================== */
    /* Ausgangslage: Kamera auf der dezentralen Seite, Karte noch unsichtbar */
    { t: 0,    ch: 1, name: "k1-start",         action: "camera", to: { scale: 0.5, x: 0, y: -12 }, dur: 0 },
    { t: 0,    ch: 1, name: "k1-zonen-weg",     action: "hide",   target: "zoneLeft", dur: 0 },
    { t: 0,    ch: 1, name: "k1-zonen-weg-2",   action: "hide",   target: "zoneRight", dur: 0 },
    { t: 0,    ch: 1, name: "k1-rail-weg",      action: "hide",   target: "rail", dur: 0 },
    { t: 0,    ch: 1, name: "k1-slip-text",     action: "type",   target: "slipEntry", text: "Carola → Albert: 3", dur: 0 },
    /* Sehen 1: Alltagsmoment, geschriebene Zeile, Bank in der Mitte */
    { t: 1,    ch: 1, name: "k1-carola",        action: "show",   target: "k1Carola" },
    { t: 1,    ch: 1, name: "k1-albert",        action: "show",   target: "k1Albert" },
    { t: 1.5,  ch: 1, name: "k1-handy",         action: "show",   target: "k1Phone" },
    { t: 3,    ch: 1, name: "k1-sendet-geld",   action: "show",   target: "k1PhoneLabel" },
    { t: 5.5,  ch: 1, name: "k1-liste",         action: "show",   target: "k1List" },
    { t: 6.5,  ch: 1, name: "k1-zeile",         action: "type",   target: "k1ListLine", text: "Carola → Albert: 3", dur: 2 },
    { t: 9.5,  ch: 1, name: "k1-bank",          action: "show",   target: "k1Bank" },
    { t: 10.5, ch: 1, name: "k1-text-1",        action: "text",   text: "Eine Bank als zentrale Institution, prüft welche Transaktionen gültig sind.", hold: 6 },
    /* Sehen 2 (Twist): Bank verschwindet, aus einer Liste werden schlagartig viele Kopien */
    { t: 17.5, ch: 1, name: "k1-bank-weg",      action: "hide",   target: "k1Bank" },
    { t: 19,   ch: 1, name: "k1-liste-weg",     action: "hide",   target: "k1List", dur: "d3" },
    { t: 19.2, ch: 1, name: "k1-kopien",        action: "show",   target: "map", dur: 0 },
    { t: 19.5, ch: 1, name: "k1-text-2",        action: "text",   text: "Als dezentrales System ermöglicht Bitcoin es, Transaktionen ohne eine Bank durchzuführen", hold: 7 },
    /* Sehen 3: neuer Eintrag auf allen Kopien gleichzeitig, Kamera zoomt in die dezentrale Seite */
    { t: 27.5, ch: 1, name: "k1-eintrag",       action: "show",   target: "entry", dur: "d4" },
    { t: 28,   ch: 1, name: "k1-text-3",        action: "text",   text: "Zahlreiche unabhängig betriebene Rechner führen die gemeinsameTransaktionsgeschichte.", hold: 4.5 },
    { t: 29,   ch: 1, name: "k1-zoom",          action: "camera", to: { scale: 1, x: 0, y: 0 }, dur: 6 },
    { t: 29,   ch: 1, name: "k1-carola-weg",    action: "hide",   target: "k1Carola" },
    { t: 29,   ch: 1, name: "k1-albert-weg",    action: "hide",   target: "k1Albert" },
    { t: 29,   ch: 1, name: "k1-handy-weg",     action: "hide",   target: "k1Phone" },
    { t: 29,   ch: 1, name: "k1-sendet-weg",    action: "hide",   target: "k1PhoneLabel" },
    { t: 33,   ch: 1, name: "k1-karte-links",   action: "show",   target: "zoneLeft" },
    { t: 33,   ch: 1, name: "k1-karte-rechts",  action: "show",   target: "zoneRight" },
    { t: 33,   ch: 1, name: "k1-karte-rail",    action: "show",   target: "rail" },
    /* Sehen 4: Namensschild Albert schreibt sich in ein Kürzel um */
    { t: 36,   ch: 1, name: "k1-kuerzel",       action: "rewrite", target: "slipEntry", from: "Carola → Albert: 3", to: "Carola → 1A2b...: 3", dur: 1.6 },
    { t: 36.5, ch: 1, name: "k1-text-4",        action: "text",   text: "Bitcoin ist pseudonym, aber nicht anonym.", hold: 4 },
    /* =================== Kapitel 2: Wie funktioniert eine Transaktion? (45 bis 85) =================== */
    /* Sehen 1: Fokus auf die Signier-Zone (Dimmen statt Zoom), beide als Kürzel, Private Key aus der Wallet, Unterschrift */
    { t: 45,   ch: 2, name: "k2-fokus-links",   action: "dim",    target: "zoneMid" },
    { t: 45,   ch: 2, name: "k2-fokus-links-2", action: "dim",    target: "zoneRight" },
    { t: 45,   ch: 2, name: "k2-fokus-links-3", action: "dim",    target: "rail" },
    { t: 45.5, ch: 2, name: "k2-kuerzel-carola", action: "rewrite", target: "slipEntry", from: "Carola → 1A2b...: 3", to: "3Cq8... → 1A2b...: 3", dur: 1.6 },
    { t: 47,   ch: 2, name: "k2-wallet",        action: "show",   target: "k2Wallet" },
    { t: 47.5, ch: 2, name: "k2-begriff-pk",    action: "term",   term: "Private Key", text: "geheim, nur Carola hat ihn.", anchor: "left", hold: 3.5 },
    { t: 48,   ch: 2, name: "k2-gravur",        action: "show",   target: "k2Engraving" },
    { t: 49,   ch: 2, name: "k2-key-raus",      action: "move",   target: "privateKey", to: { x: 217, y: -82 }, dur: 2 },
    { t: 52.2, ch: 2, name: "k2-begriff-wallet", action: "term",  term: "Wallet", text: "verwahrt privat und Public Key.", anchor: "left", hold: 3 },
    { t: 52,   ch: 2, name: "k2-unterschrift",  action: "draw",   target: "k2Signature", dur: 2 },
    { t: 53,   ch: 2, name: "k2-text-1",        action: "text",   text: "Mit dem Private Key unterschreibt die Wallet eine Transaktion digital.", hold: 5 },
    /* Sehen 2: die unterschriebene Transaktion geht ins Netzwerk, ein Public Key prüft, Häkchen */
    { t: 59,   ch: 2, name: "k2-netz-an",       action: "undim",  target: "zoneMid" },
    { t: 59,   ch: 2, name: "k2-rail-an",       action: "undim",  target: "rail" },
    { t: 59,   ch: 2, name: "k2-punkt",         action: "show",   target: "point", dur: "d4" },
    { t: 59.5, ch: 2, name: "k2-punkt-netz",    action: "point",  from: "left", to: "mid", dur: 3 },
    { t: 62.5, ch: 2, name: "k2-public-key",    action: "show",   target: "k2PublicKey" },
    { t: 63,   ch: 2, name: "k2-begriff-pubkey", action: "term",  term: "Public Key", text: "kennt jeder, dient zum Prüfen.", anchor: "left", hold: 3.5 },
    { t: 64,   ch: 2, name: "k2-haken",         action: "show",   target: "k2Check", dur: "d3" },
    { t: 64,   ch: 2, name: "k2-text-2",        action: "text",   text: "Der Public Key ermöglicht es dem Netzwerk, diese Unterschrift zu prüfen, ohne den Private Key offenzulegen.", hold: 7 },
    { t: 72.2, ch: 2, name: "k2-text-3",        action: "text",   text: "Geht dieser Private Key verloren ist der Zugang zu allen Werten in der Wallet verloren.", hold: 6.5 },
    /* Sehen 3: Linie vom Schlüssel zum Eintrag, Transaktion wandert in den Wartebereich */
    { t: 74,   ch: 2, name: "k2-linie",         action: "draw",   target: "k2Link", dur: 2 },
    { t: 76,   ch: 2, name: "k2-kette-an",      action: "undim",  target: "zoneRight" },
    { t: 76,   ch: 2, name: "k2-wartebereich",  action: "show",   target: "waitArea" },
    { t: 77,   ch: 2, name: "k2-punkt-warte",   action: "point",  from: "mid", to: "wait", dur: 3 },
    { t: 80,   ch: 2, name: "k2-text-4",        action: "text",   text: "Die Transaktion wird digital verzeichnet.", hold: 4 },
    { t: 82,   ch: 2, name: "k2-pubkey-weg",    action: "hide",   target: "k2PublicKey" },
    { t: 82,   ch: 2, name: "k2-haken-weg",     action: "hide",   target: "k2Check" },
    { t: 82,   ch: 2, name: "k2-linie-weg",     action: "hide",   target: "k2Link" },
    /* =================== Kapitel 3 und 4: folgen in Schritt 4 und 5 =================== */
  ],
};
</script>

  --layer-0: 0;

  --film-gap: var(--space-7);
  --film-zone-w: calc((var(--film-stage-w) - 2 * var(--film-margin) - 2 * var(--film-gap)) / 3);
  --film-text-w: calc(var(--film-stage-w) - 2 * var(--film-margin) - 2 * var(--space-8));
}

/* ---------- Bühne und Letterbox ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--immersive-bg);
  color: var(--immersive-ink);
  font-family: var(--font-family-switzer), sans-serif;
  -webkit-font-smoothing: antialiased;
}
#viewport {
  position: fixed; inset: 0;
  background: var(--immersive-bg);
  overflow: hidden;
}
#stage {
  position: absolute;
  left: 0; top: 0;
  width: var(--film-stage-w); height: var(--film-stage-h);
  background: var(--immersive-bg);
  overflow: hidden;
  transform-origin: 0 0;
  /* transform wird per JS gesetzt: translate + scale zum Einpassen ins Fenster */
}

/* ---------- Karte (SVG, Line-Art) ---------- */
#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
}
#scene .ink   { stroke: var(--immersive-ink); }
#scene .body  { stroke: var(--immersive-body); }
#scene .muted { stroke: var(--immersive-muted); }
#scene .info  { stroke: var(--immersive-focus); }
#scene .line  { fill: none; stroke-width: calc(var(--film-line) / var(--cam-scale, 1)); stroke-linecap: round; stroke-linejoin: round; }
#scene .icon .line { stroke-width: calc(var(--film-line) / var(--cam-scale, 1) / var(--icon-scale, 1)); }
#scene #k1 .line { stroke-width: var(--film-line); }
#scene #k1 .icon .line { stroke-width: calc(var(--film-line) / var(--icon-scale, 1)); }
#scene .rail  { stroke-dasharray: var(--space-1) var(--space-2); opacity: var(--dimmed-opacity); }
#scene .point-core { fill: var(--immersive-accent); stroke: none; }
#scene .point-ring { fill: none; stroke: var(--immersive-accent); stroke-width: calc(var(--film-line) / var(--cam-scale, 1)); opacity: var(--dimmed-opacity); }
#scene .mono {
  font-family: var(--font-family-dm-mono), monospace;
  font-weight: 400;
  fill: var(--immersive-ink);
  /* Adressen, Kürzel und Buchzeilen behalten Groß- und Kleinschreibung: dokumentierte Ausnahme von T3 */
}
#scene .mono.entry-line { font-size: var(--font-size-h5); }
#scene .mono.list-line  { font-size: var(--font-size-h4); }
#scene .name {
  font-family: var(--font-family-switzer), sans-serif;
  font-size: var(--font-size-h4);
  font-weight: 500;
  fill: var(--immersive-ink);
  text-anchor: middle;
}
#scene .caption {
  font-family: var(--font-family-switzer), sans-serif;
  font-size: var(--font-size-body-l);
  font-weight: 400;
  fill: var(--immersive-body);
}
#scene .engraving {
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-l);
  font-weight: 400;
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.08em;
  fill: var(--immersive-muted);
  text-anchor: middle;
}
#scene .rail-dash { stroke-dasharray: var(--space-2) var(--space-2); }
#scene [data-draw] { stroke-dasharray: 1; stroke-dashoffset: 1; }
#scene .zone-label {
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-l);
  font-weight: 400;
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.12em;
  fill: var(--immersive-muted);
  text-anchor: middle;
}

/* ---------- Kapiteltitel (oben links) ---------- */
#title {
  position: absolute;
  left: var(--film-margin); top: var(--space-8);
  display: flex; flex-direction: column; gap: var(--space-2);
  opacity: 0;
}
#title .eyebrow {
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-l);
  font-weight: 400;
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.12em;
  color: var(--immersive-muted);
}
#title .headline {
  font-family: var(--font-family-switzer), sans-serif;
  font-size: var(--font-size-h3);
  font-weight: 700;
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--immersive-ink);
}

/* ---------- Fortschrittsanzeige (oben rechts, vier Punkte) ---------- */
#progress {
  position: absolute;
  right: var(--film-margin); top: var(--space-8);
  display: flex; gap: var(--space-4);
  height: var(--font-size-caption-l);
  align-items: center;
}
#progress .dot {
  position: relative;
  width: var(--space-3); height: var(--space-3);
  border: var(--film-line) solid var(--immersive-muted);
}
#progress .dot .fill {
  position: absolute; inset: 0;
  background: var(--immersive-accent);
  opacity: 0;
}
#progress .dot.active { border-color: var(--immersive-accent); }

/* ---------- Textzeile (Ausstellungstext, unten mittig) ---------- */
#textline {
  position: absolute;
  left: 50%; bottom: var(--space-8);
  transform: translateX(-50%);
  width: var(--film-text-w);
  text-align: center;
  font-family: var(--font-family-switzer), sans-serif;
  font-size: var(--font-size-h2);
  font-weight: 400;
  line-height: 1.25;
  color: var(--immersive-ink);
  opacity: 0;
}

/* ---------- Begriffskarte (blau = Information) ---------- */
#term {
  position: absolute;
  top: calc(var(--space-8) + var(--space-9));
  width: var(--film-zone-w);
  padding: var(--space-4) var(--space-5);
  border: var(--film-line) solid var(--immersive-focus);
  background: var(--layer-surface-raised);
  display: flex; flex-direction: column; gap: var(--space-2);
  opacity: 0;
}
#term .term-name {
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-l);
  font-weight: 500;
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.12em;
  color: var(--immersive-focus);
}
#term .term-text {
  font-family: var(--font-family-switzer), sans-serif;
  font-size: var(--font-size-body-l);
  font-weight: 400;
  line-height: 1.35;
  color: var(--immersive-body);
}

/* ---------- Dev-Modus (Taste D), in Produktion unsichtbar ---------- */
#devCue {
  position: absolute;
  left: 50%; top: var(--space-8);
  transform: translateX(-50%);
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-m);
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.12em;
  color: var(--immersive-focus);
  display: none;
}
#devbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: none;
  align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--layer-surface-elevated);
  border-top: var(--film-line) solid var(--border-surface-raised);
  font-family: var(--font-family-dm-mono), monospace;
  font-size: var(--font-size-caption-m);
  text-transform: var(--text-transform-dm-mono);
  letter-spacing: 0.08em;
  color: var(--immersive-body);
  z-index: var(--layer-500);
}
body.dev #devbar { display: flex; }
body.dev #devCue { display: block; }
#devbar button {
  font: inherit; text-transform: inherit; letter-spacing: inherit;
  color: var(--immersive-ink);
  background: var(--layer-surface-raised);
  border: var(--film-line) solid var(--layer-border);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
}
#devbar input[type=range] { flex: 1; accent-color: var(--immersive-accent); }
#devbar .time { color: var(--immersive-ink); min-width: 14ch; }
#devbar .cue { color: var(--immersive-focus); min-width: 22ch; }
#devbar .hint { color: var(--immersive-muted); }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage" aria-label="Erklärfilm: Wie funktioniert Bitcoin?">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g id="map" data-target="map" data-default="0">
        <g id="camera">
          <line id="rail" class="line muted rail" data-target="rail"></line>
          <g id="zoneLeft" data-target="zoneLeft"></g>
          <g id="zoneMid" data-target="zoneMid"></g>
          <g id="zoneRight" data-target="zoneRight"></g>
          <g id="point" data-target="point" data-default="0">
            <circle id="pointRing" class="point-ring"></circle>
            <circle id="pointCore" class="point-core"></circle>
          </g>
        </g>
      </g>
      <g id="k1"></g>
    </svg>

    <div id="title">
      <div class="eyebrow" id="titleEyebrow"></div>
      <div class="headline" id="titleHeadline"></div>
    </div>

    <div id="progress" aria-hidden="true">
      <div class="dot" data-n="1"><div class="fill"></div></div>
      <div class="dot" data-n="2"><div class="fill"></div></div>
      <div class="dot" data-n="3"><div class="fill"></div></div>
      <div class="dot" data-n="4"><div class="fill"></div></div>
    </div>

    <div id="term">
      <div class="term-name" id="termName"></div>
      <div class="term-text" id="termText"></div>
    </div>

    <div id="textline"></div>
    <div id="devCue"></div>
  </div>
</div>

<div id="devbar">
  <button id="devPlay" type="button">Play</button>
  <span class="time" id="devTime">00:00.00 / 00:00.00</span>
  <span id="devChapter">K1</span>
  <span class="cue" id="devCueName"></span>
  <input id="devScrub" type="range" min="0" max="1" step="0.04" value="0">
  <span class="hint">D Dev · Leertaste Play · 1 bis 4 Kapitel · Pfeile 1s · Shift 1 Frame</span>
</div>

<script>
/* =====================================================================
   ENGINE: deterministische Zeitachse. render(t) baut den Zustand des
   ganzen Bildes allein aus t auf. seek(t) springt, play() läuft weiter.
   Keine setTimeouts, keine CSS-Transitions.
   ===================================================================== */
(function () {
  "use strict";

  /* ---------- Tokens auslesen (Dauern, Kurven, Geometrie) ---------- */
  const rootStyle = getComputedStyle(document.documentElement);
  const tok = (name) => rootStyle.getPropertyValue(name).trim();
  const tokNum = (name) => parseFloat(tok(name));
  const tokSec = (name) => {
    const v = tok(name);
    return v.endsWith("ms") ? parseFloat(v) / 1000 : parseFloat(v);
  };
  function parseEase(name) {
    const v = tok(name);
    if (v === "linear") return (p) => p;
    const m = v.match(/cubic-bezier\(([^)]+)\)/);
    if (!m) return (p) => p;
    const [x1, y1, x2, y2] = m[1].split(",").map(Number);
    return cubicBezier(x1, y1, x2, y2);
  }
  function cubicBezier(x1, y1, x2, y2) {
    const A = (a1, a2) => 1 - 3 * a2 + 3 * a1;
    const B = (a1, a2) => 3 * a2 - 6 * a1;
    const C = (a1) => 3 * a1;
    const calc = (t, a1, a2) => ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
    const slope = (t, a1, a2) => 3 * A(a1, a2) * t * t + 2 * B(a1, a2) * t + C(a1);
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const s = slope(t, x1, x2);
        if (Math.abs(s) < 1e-6) break;
        t -= (calc(t, x1, x2) - x) / s;
      }
      t = Math.min(1, Math.max(0, t));
      return calc(t, y1, y2);
    };
  }

  const D = {
    d1: tokSec("--duration-1"), d2: tokSec("--duration-2"), d3: tokSec("--duration-3"),
    d4: tokSec("--duration-4"), d5: tokSec("--duration-5"), d6: tokSec("--duration-6"),
  };
  const E = {
    standard: parseEase("--ease-standard"),
    entrance: parseEase("--ease-entrance"),
    exit: parseEase("--ease-exit"),
    mechanical: parseEase("--ease-mechanical"),
  };
  const SP = {};
  for (let i = 1; i <= 9; i++) SP[i] = tokNum("--space-" + i);

  /* ---------- Geometrie der Bühne aus Tokens ---------- */
  const G = {
    w: tokNum("--film-stage-w"),
    h: tokNum("--film-stage-h"),
    margin: tokNum("--film-margin"),
    gap: tokNum("--film-gap"),
  };
  G.zoneW = (G.w - 2 * G.margin - 2 * G.gap) / 3; /* entspricht --film-zone-w */
  G.zoneX = {
    left: G.margin,
    mid: G.margin + G.zoneW + G.gap,
    right: G.margin + 2 * (G.zoneW + G.gap),
  };
  G.anchor = {
    left: G.zoneX.left + G.zoneW / 2,
    mid: G.zoneX.mid + G.zoneW / 2,
    right: G.zoneX.right + G.zoneW / 2,
  };
  G.points = {};
  G.railY = G.h / 2 + SP[5];         /* Fahrbahn des Transaktionspunkts, leicht unter der Mitte (Platz für Begriffskarte) */
  G.mapTop = SP[8] + SP[9] + SP[9];  /* unter Titel und Begriffskarte */
  for (const z of ["left", "mid", "right"]) G.points[z] = { x: G.anchor[z], y: G.railY };

  /* ---------- SVG-Bausteine ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };
  const $ = (id) => document.getElementById(id);

  $("scene").setAttribute("viewBox", `0 0 ${G.w} ${G.h}`);

  /* Fahrbahn */
  const rail = $("rail");
  rail.setAttribute("x1", G.anchor.left); rail.setAttribute("x2", G.anchor.right);
  rail.setAttribute("y1", G.railY); rail.setAttribute("y2", G.railY);

  /* Icons: Tabler.io Outline, 24er Raster. Einheitliche Größe size-icon-lg mal Faktor. */
  const ICONS = {
    key: ["M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0z", "M15 9h.01"],
    user: ["M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0", "M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"],
    mobile: ["M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14z", "M11 4h2", "M12 17v.01"],
    wallet: ["M17 8v-3a1 1 0 0 0 -1 -1h-10a2 2 0 0 0 0 4h12a1 1 0 0 1 1 1v3m0 4v3a1 1 0 0 1 -1 1h-12a2 2 0 0 1 -2 -2v-12", "M20 12v4h-4a2 2 0 0 1 0 -4h4"],
    check: ["M5 12l5 5l10 -10"],
    bank: ["M3 21l18 0", "M3 10l18 0", "M5 6l7 -3l7 3", "M4 10l0 11", "M20 10l0 11", "M8 14l0 3", "M12 14l0 3", "M16 14l0 3"],
  };
  function icon(name, cx, cy, factor, parent) {
    const size = tokNum("--size-icon-lg") * factor, sc = size / 24;
    const g = svg("g", { transform: `translate(${cx - size / 2} ${cy - size / 2}) scale(${sc})`, class: "icon", style: `--icon-scale: ${sc}` }, parent);
    for (const d of ICONS[name]) svg("path", { d, class: "line ink" }, g);
    return g;
  }

  /* Zone links: Signieren. Ein Zettel mit der Transaktionszeile und ein Schlüssel. */
  (function buildLeft() {
    const g = $("zoneLeft");
    const w = G.zoneW * 0.6, h = w * 0.55;
    const x = G.anchor.left - w / 2, y = G.railY - h / 2;
    svg("rect", { x, y, width: w, height: h, class: "line ink", style: "fill: var(--immersive-bg)" }, g);
    /* Zeile 1: die Transaktionszeile als Text (Inhalt kommt aus dem SCRIPT) */
    const entry = svg("text", { x: x + SP[4], y: y + h / 4 + SP[2], class: "mono entry-line", id: "slipEntry" }, g);
    entry.textContent = "";
    for (let i = 2; i <= 3; i++) {
      const ly = y + (h / 4) * i;
      svg("line", { x1: x + SP[4], x2: x + w - SP[4] - (i === 3 ? w * 0.3 : 0), y1: ly, y2: ly, class: "line body" }, g);
    }
    /* Der Private Key: beweglich (Target privateKey), mit Gravur (Target k2Engraving) */
    const keyX = G.anchor.left, keyY = y + h + SP[7];
    const keyG = svg("g", { id: "privateKey", "data-target": "privateKey" }, g);
    icon("key", keyX, keyY, 3, keyG);
    const eng = svg("text", { x: keyX, y: keyY + SP[7] + SP[3], class: "engraving", "data-target": "k2Engraving", "data-default": "0" }, keyG);
    eng.textContent = "7F3A9C02E51B…";
    G.keyPos = { x: keyX, y: keyY };
    /* Die Unterschrift unter der Transaktion, zeichnet sich (Target k2Signature) */
    const sx = x + w - SP[4] - w * 0.3 + SP[4], sy = y + (h / 4) * 3;
    svg("path", { d: `M ${sx} ${sy} c 10 -22 22 -22 32 0 s 22 22 32 0 s 16 -16 26 -8`, class: "line ink", pathLength: "1", "data-draw": "k2Signature" }, g);
    G.sigEnd = { x: sx + 90, y: sy };
  })();

  /* Zone Mitte: Das Buch. Acht identische Kopien im Ring, alle gleichwertig,
     untereinander verflochten (Nachbarn und übernächste Nachbarn), keine Mitte.
     Die Fahrbahn des Transaktionspunkts läuft durch die Lücke im Geflecht. */
  (function buildMid() {
    const g = $("zoneMid");
    const cx = G.anchor.mid, cy = G.railY;
    const n = 8, r = G.zoneW * 0.38;
    const cw = G.zoneW / 7, ch = cw * 1.3;
    const centers = [];
    for (let i = 0; i < n; i++) {
      const a = (2 * Math.PI / n) * i + Math.PI / n;   /* um eine halbe Teilung gedreht: keine Kopie auf der Fahrbahn */
      centers.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    /* Geflecht: Ring plus Verbindungen zu den übernächsten Nachbarn, hinter den Kopien */
    for (let i = 0; i < n; i++) {
      for (const step of [1, 2]) {
        const a = centers[i], b = centers[(i + step) % n];
        svg("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "line muted" }, g);
      }
    }
    /* Kopien: schwarz gefüllt, damit die Linien dahinter enden */
    for (const { x, y } of centers) {
      const copy = svg("g", { transform: `translate(${x - cw / 2} ${y - ch / 2})` }, g);
      svg("rect", { x: 0, y: 0, width: cw, height: ch, class: "line ink", style: "fill: var(--immersive-bg)" }, copy);
      for (let i = 1; i <= 3; i++) {
        const ly = (ch / 5) * i;
        svg("line", { x1: SP[3], x2: cw - SP[3], y1: ly, y2: ly, class: "line body" }, copy);
      }
      /* Zeile 4: der neue Eintrag, erscheint auf allen Kopien gleichzeitig (Target "entry") */
      const ly = (ch / 5) * 4;
      svg("line", { x1: SP[3], x2: cw - SP[3] - cw * 0.3, y1: ly, y2: ly, class: "line ink", "data-target": "entry", "data-default": "0" }, copy);
    }
    /* Geometrie für spätere Kapitel: die Kopie links oben liegt dem Zettel am nächsten */
    G.ring = { centers, cw, ch, r, nearestLeft: centers.reduce((best, c) => (c.x < best.x || (c.x === best.x && c.y < best.y) ? c : best), centers[0]) };
  })();

  /* Zone rechts: Die Kette. Drei verzahnte Blöcke. */
  (function buildRight() {
    const g = $("zoneRight");
    const n = 3;
    const bw = (G.zoneW - SP[5]) / n, bh = bw * 0.72;
    const td = SP[4], tw = bh * 0.18;       /* Zahntiefe, halbe Zahnbreite */
    const x0 = G.anchor.right - (bw * n) / 2, y = G.railY - bh / 2;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * bw, my = y + bh / 2;
      const d = [
        `M ${x} ${y}`, `H ${x + bw}`,
        `V ${my - tw}`, `H ${x + bw + td}`, `V ${my + tw}`, `H ${x + bw}`,   /* Zahn rechts */
        `V ${y + bh}`, `H ${x}`,
        i === 0 ? "" : `V ${my + tw} H ${x + td} V ${my - tw} H ${x}`,         /* Kerbe links */
        "Z",
      ].join(" ");
      svg("path", { d, class: "line ink", style: "fill: var(--immersive-bg)" }, g);
      /* Inhalt: drei Zeilen als Bündel */
      for (let k = 1; k <= 3; k++) {
        const ly = y + (bh / 4) * k;
        svg("line", { x1: x + SP[5] + (i === 0 ? 0 : td), x2: x + bw - SP[5], y1: ly, y2: ly, class: "line body" }, g);
      }
    }
  })();

  /* Wartebereich: in der rechten Zone über der Kette (Target waitArea) */
  (function buildWait() {
    const cam = $("camera");
    const g = svg("g", { id: "waitArea", "data-target": "waitArea", "data-default": "0" }, cam);
    const w = G.zoneW - SP[5], h = SP[9] + SP[4];
    const x = G.anchor.right - w / 2, y = G.railY - SP[9] - SP[8] - h;
    svg("rect", { x, y, width: w, height: h, class: "line muted rail-dash" }, g);
    const l = svg("text", { x: G.anchor.right, y: y - SP[4], class: "zone-label" }, g); l.textContent = "Wartebereich";
    G.points.wait = { x: G.anchor.right, y: y + h / 2 };
    G.waitBox = { x, y, w, h };
  })();

  /* Kapitel 2: Wallet, Public Key, Häkchen, Verbindungslinie (in Kartenkoordinaten, innerhalb der Kamera) */
  (function buildK2() {
    const cam = $("camera");
    const grp = (id) => svg("g", { id, "data-target": id, "data-default": "0" }, cam);
    /* Wallet unter dem Schlüssel */
    const gW = grp("k2Wallet");
    icon("wallet", G.keyPos.x, G.keyPos.y + SP[7] + SP[5], 3, gW);
    /* Public Key über dem Netzwerk */
    const gP = grp("k2PublicKey");
    const px = G.anchor.mid, py = G.mapTop + SP[3];
    icon("key", px, py, 3, gP);
    const pl = svg("text", { x: px, y: py - SP[7], class: "zone-label" }, gP); pl.textContent = "Public Key";
    /* Häkchen neben dem Transaktionspunkt in der Lücke des Geflechts */
    const gC = grp("k2Check");
    icon("check", G.anchor.mid + SP[7], G.railY, 2, gC);
    /* Linie vom Schlüssel (Endposition) zum Eintrag der Kopie, die dem Zettel am nächsten liegt (links oben im Ring) */
    const gL = svg("g", { id: "k2Link", "data-target": "k2Link" }, cam); /* sichtbar, die Linie zeichnet sich über draw */
    const kx = G.keyPos.x + 217, ky = G.keyPos.y - 82;
    const c = G.ring.nearestLeft, cw = G.ring.cw, ch = G.ring.ch;
    const ex = c.x - cw / 2 + SP[3], ey = c.y - ch / 2 + (ch / 5) * 4;
    svg("line", { x1: kx + SP[6], y1: ky, x2: ex, y2: ey, class: "line ink", pathLength: "1", "data-draw": "k2Link" }, gL);
  })();

  /* Kapitel 1: Alltagsmoment und Bank, in Bühnenkoordinaten, außerhalb der Kamera */
  (function buildK1() {
    const root = $("k1");
    const cy = G.h / 2;
    const xCarola = G.w / 4, xAlbert = (G.w / 4) * 3;
    const grp = (id) => svg("g", { id, "data-target": id, "data-default": "0" }, root);
    /* Carola mit Handy */
    const gC = grp("k1Carola");
    icon("user", xCarola, cy, 4, gC);
    const nC = svg("text", { x: xCarola, y: cy + SP[9], class: "name" }, gC); nC.textContent = "Carola";
    const gP = grp("k1Phone");
    icon("mobile", xCarola + SP[9], cy - SP[6], 2.5, gP);
    const gPL = grp("k1PhoneLabel");
    const lbl = svg("text", { x: xCarola + SP[9] + SP[7], y: cy - SP[6] + SP[2], class: "caption" }, gPL); lbl.textContent = "sendet Geld";
    /* Albert */
    const gA = grp("k1Albert");
    icon("user", xAlbert, cy, 4, gA);
    const nA = svg("text", { x: xAlbert, y: cy + SP[9], class: "name" }, gA); nA.textContent = "Albert";
    /* Die eine Liste in der Mitte */
    const gL = grp("k1List");
    const lw = G.zoneW * 0.66, lh = lw * 0.6, lx = G.w / 2 - lw / 2, ly = cy - lh / 2;
    svg("rect", { x: lx, y: ly, width: lw, height: lh, class: "line ink", style: "fill: var(--immersive-bg)" }, gL);
    const line = svg("text", { x: lx + SP[5], y: ly + lh / 4 + SP[2], class: "mono list-line", id: "k1ListLine" }, gL); line.textContent = "";
    for (let i = 2; i <= 3; i++) {
      const yy = ly + (lh / 4) * i;
      svg("line", { x1: lx + SP[5], x2: lx + lw - SP[5] - (i === 3 ? lw * 0.3 : 0), y1: yy, y2: yy, class: "line body" }, gL);
    }
    /* Die Bank über der Liste */
    const gB = grp("k1Bank");
    icon("bank", G.w / 2, ly - SP[9], 4, gB);
    const bl = svg("text", { x: G.w / 2, y: ly - SP[9] + SP[8] + SP[3], class: "zone-label" }, gB); bl.textContent = "Bank";
  })();

  /* Transaktionspunkt */
  $("pointCore").setAttribute("r", SP[3] / 2);
  $("pointRing").setAttribute("r", SP[5] / 2);

  /* ---------- Zustand und Tracks ---------- */
  /* Targets: alle Elemente mit data-target. data-default = Sichtbarkeit bei t = 0 (1 oder 0). */
  const targetNodes = {}, targetDefault = {};
  document.querySelectorAll("[data-target]").forEach((n) => {
    const key = n.getAttribute("data-target");
    (targetNodes[key] = targetNodes[key] || []).push(n);
    if (n.hasAttribute("data-default")) targetDefault[key] = Number(n.getAttribute("data-default"));
  });
  const targets = Object.keys(targetNodes);
  const textNodes = {};
  document.querySelectorAll("text[id]").forEach((n) => { textNodes[n.id] = n; });
  const drawNodes = {};
  document.querySelectorAll("[data-draw]").forEach((n) => { drawNodes[n.getAttribute("data-draw")] = n; });
  const DIM = tokNum("--dimmed-opacity");
  const chapters = SCRIPT.chapters.slice().sort((a, b) => a.start - b.start);
  const total = chapters[chapters.length - 1].start + chapters[chapters.length - 1].duration;

  function freshState() {
    const s = {
      opacity: { title: 0, text: 0, term: 0 },
      title: null,
      text: "",
      term: { name: "", text: "", anchor: "mid" },
      point: { x: G.anchor.left, y: G.railY },
      camera: { scale: 1, x: 0, y: 0 },
      progress: { active: 0, fill: 0 },
      texts: {},
      draws: {},
      moves: {},
      cue: "",
    };
    for (const t of targets) s.opacity[t] = targetDefault[t] ?? 1;
    return s;
  }

  const tracks = [];
  let order = 0;
  function track(start, dur, ease, apply) {
    tracks.push({ start, dur, ease, apply, order: order++ });
  }
  const durOf = (v) => (v === undefined ? D.d6 : v === 0 ? 0 : D[v] ?? D.d6);
  function fadeIn(key, start, dur) { track(start, durOf(dur), E.entrance, (s, p) => { s.opacity[key] = p; }); }
  function fadeOut(key, start, dur) { track(start, durOf(dur), E.exit, (s, p) => { s.opacity[key] = 1 - p; }); }
  const lerp = (a, b, p) => a + (b - a) * p;
  const resolvePt = (v) => (typeof v === "number" ? { x: v, y: G.railY } : typeof v === "string" ? G.points[v] : v);

  /* Kapiteltitel und Fortschritt kommen aus der Kapitelliste */
  for (const ch of chapters) {
    track(ch.start, 0, E.standard, (s) => { s.title = ch; s.progress.active = ch.id; });
    track(ch.start, D.d3, E.standard, (s, p) => { s.progress.fill = p; });
    fadeIn("title", ch.start);
    fadeOut("title", ch.start + ch.duration - D.d6);
  }

  /* Cues in Tracks übersetzen */
  const cues = SCRIPT.cues.slice().sort((a, b) => a.t - b.t);
  const usedTerms = new Map();
  let lastPoint = G.points.left;
  const lastMove = {};
  let lastCam = { scale: 1, x: 0, y: 0 };
  for (const c of cues) {
    track(c.t, 0, E.standard, (s) => { s.cue = c.name; });
    switch (c.action) {
      case "text":
        track(c.t, 0, E.standard, (s) => { s.text = c.text; });
        fadeIn("text", c.t);
        fadeOut("text", c.t + c.hold);
        break;
      case "term":
        if (usedTerms.has(c.term)) console.warn(`Begriff doppelt: "${c.term}" bei t=${c.t} und t=${usedTerms.get(c.term)}`);
        usedTerms.set(c.term, c.t);
        track(c.t, 0, E.standard, (s) => { s.term = { name: c.term, text: c.text, anchor: c.anchor || "mid" }; });
        fadeIn("term", c.t);
        fadeOut("term", c.t + c.hold);
        break;
      case "show":
        if (!targetNodes[c.target]) console.warn(`Unbekanntes Target "${c.target}" (${c.name})`);
        fadeIn(c.target, c.t, c.dur);
        break;
      case "hide":
        if (!targetNodes[c.target]) console.warn(`Unbekanntes Target "${c.target}" (${c.name})`);
        fadeOut(c.target, c.t, c.dur);
        break;
      case "type": {
        if (!textNodes[c.target]) console.warn(`Unbekanntes Textelement "${c.target}" (${c.name})`);
        const full = c.text;
        track(c.t, c.dur, E.mechanical, (s, p) => { s.texts[c.target] = full.slice(0, Math.round(p * full.length)); });
        break;
      }
      case "rewrite": {
        if (!textNodes[c.target]) console.warn(`Unbekanntes Textelement "${c.target}" (${c.name})`);
        const n = Math.max(c.from.length, c.to.length);
        track(c.t, c.dur, E.mechanical, (s, p) => { const k = Math.round(p * n); s.texts[c.target] = c.to.slice(0, k) + c.from.slice(k); });
        break;
      }
      case "point": {
        const from = c.from !== undefined ? resolvePt(c.from) : lastPoint;
        const to = resolvePt(c.to);
        if (!from || !to) console.warn(`Punkt: unbekannter Ort (${c.name})`);
        lastPoint = to;
        track(c.t, c.dur, E.mechanical, (s, p) => { s.point = { x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) }; });
        break;
      }
      case "dim":
        track(c.t, D.d4, E.standard, (s, p) => { s.opacity[c.target] = lerp(1, DIM, p); });
        break;
      case "undim":
        track(c.t, D.d4, E.standard, (s, p) => { s.opacity[c.target] = lerp(DIM, 1, p); });
        break;
      case "move": {
        const from = lastMove[c.target] || { x: 0, y: 0 };
        const to = c.to;
        lastMove[c.target] = to;
        track(c.t, c.dur, E.mechanical, (s, p) => { s.moves[c.target] = { x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) }; });
        break;
      }
      case "draw":
        if (!drawNodes[c.target]) console.warn(`Unbekannte Linie "${c.target}" (${c.name})`);
        track(c.t, c.dur, E.mechanical, (s, p) => { s.draws[c.target] = p; });
        break;
      case "camera": {
        const from = lastCam;
        const to = { scale: Math.min(1, c.to.scale ?? from.scale), x: c.to.x ?? from.x, y: c.to.y ?? from.y };
        if ((c.to.scale ?? 1) > 1) console.warn(`Kamera: scale > 1 nicht erlaubt (${c.name}), auf 1 begrenzt`);
        lastCam = to;
        track(c.t, c.dur, E.mechanical, (s, p) => {
          s.camera = { scale: lerp(from.scale, to.scale, p), x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) };
        });
        break;
      }
      default:
        console.warn(`Unbekannte Aktion "${c.action}" (${c.name})`);
    }
    if (c.ch) {
      const ch = chapters.find((k) => k.id === c.ch);
      if (ch && (c.t < ch.start || c.t >= ch.start + ch.duration)) console.warn(`Cue "${c.name}" liegt außerhalb von Kapitel ${c.ch}`);
    }
  }
  tracks.sort((a, b) => a.start - b.start || a.order - b.order);

  /* ---------- Malen ---------- */
  const el = {
    title: $("title"), eyebrow: $("titleEyebrow"), headline: $("titleHeadline"),
    text: $("textline"), term: $("term"), termName: $("termName"), termText: $("termText"),
    camera: $("camera"), point: $("point"), devCue: $("devCue"),
    dots: Array.from(document.querySelectorAll("#progress .dot")),
  };

  const cache = {};
  const setIf = (key, node, prop, value) => {
    if (cache[key] === value) return;
    cache[key] = value;
    node[prop] = value;
  };
  const setStyle = (key, node, prop, value) => {
    if (cache[key] === value) return;
    cache[key] = value;
    node.style[prop] = value;
  };
  const setAttr = (key, node, name, value) => {
    if (cache[key] === value) return;
    cache[key] = value;
    node.setAttribute(name, value);
  };

  function paint(s) {
    for (const t of targets) {
      const v = String(s.opacity[t].toFixed(3));
      if (cache["op:" + t] === v) continue;
      cache["op:" + t] = v;
      for (const n of targetNodes[t]) n.style.opacity = v;
    }
    for (const id in textNodes) setIf("txt:" + id, textNodes[id], "textContent", s.texts[id] || "");
    for (const id in drawNodes) setStyle("draw:" + id, drawNodes[id], "strokeDashoffset", String((1 - (s.draws[id] || 0)).toFixed(4)));
    for (const t of targets) {
      const m = s.moves[t] || { x: 0, y: 0 };
      const v = `translate(${m.x.toFixed(2)} ${m.y.toFixed(2)})`;
      if (cache["mv:" + t] === v) continue;
      cache["mv:" + t] = v;
      if (m.x !== 0 || m.y !== 0 || cache["mvset:" + t]) { cache["mvset:" + t] = true; for (const n of targetNodes[t]) n.setAttribute("transform", v); }
    }
    setStyle("op:title", el.title, "opacity", String(s.opacity.title.toFixed(3)));
    setStyle("op:text", el.text, "opacity", String(s.opacity.text.toFixed(3)));
    setStyle("op:term", el.term, "opacity", String(s.opacity.term.toFixed(3)));
    if (s.title) {
      setIf("eyebrow", el.eyebrow, "textContent", `Kapitel ${s.title.id}`);
      setIf("headline", el.headline, "textContent", s.title.title);
    }
    setIf("text", el.text, "textContent", s.text);
    setIf("termName", el.termName, "textContent", s.term.name);
    setIf("termText", el.termText, "textContent", s.term.text);
    setStyle("termLeft", el.term, "left", `${G.zoneX[s.term.anchor] || G.zoneX.mid}px`);
    setAttr("point", el.point, "transform", `translate(${s.point.x.toFixed(2)} ${s.point.y.toFixed(2)})`);
    const cx = G.w / 2, cy = G.h / 2;
    setStyle("camScale", el.camera, "cssText", `--cam-scale: ${s.camera.scale.toFixed(4)}`);
    setAttr("camera", el.camera, "transform",
      `translate(${(cx + s.camera.x).toFixed(2)} ${(cy + s.camera.y).toFixed(2)}) scale(${s.camera.scale.toFixed(4)}) translate(${-cx} ${-cy})`);
    el.dots.forEach((d, i) => {
      const n = i + 1;
      const active = n === s.progress.active;
      setIf("dotcls" + n, d, "className", active ? "dot active" : "dot");
      setStyle("dotfill" + n, d.firstElementChild, "opacity", active ? String(s.progress.fill.toFixed(3)) : "0");
    });
    setIf("devCue", el.devCue, "textContent", s.cue);
  }

  function render(t) {
    const s = freshState();
    for (const tr of tracks) {
      if (t < tr.start) break;
      const p = tr.dur > 0 ? Math.min(1, (t - tr.start) / tr.dur) : 1;
      tr.apply(s, tr.ease(p));
    }
    paint(s);
    return s;
  }

  /* ---------- Bühne einpassen (Letterbox auf Schwarz) ---------- */
  const stage = $("stage");
  function fit() {
    const vw = window.innerWidth;
    const vh = window.innerHeight - (devOn ? dev.bar.offsetHeight : 0); /* Dev-Leiste nimmt Platz, Bühne bleibt vollständig sichtbar */
    const scale = Math.min(vw / G.w, vh / G.h);
    const x = (vw - G.w * scale) / 2, y = (vh - G.h * scale) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }

  /* ---------- Transport ---------- */
  let time = 0, playing = false, rafId = 0, wallStart = 0, timeStart = 0;
  const wrap = (t) => ((t % total) + total) % total;

  function seek(t) {
    time = wrap(t);
    if (playing) { wallStart = performance.now(); timeStart = time; }
    render(time);
    devUpdate();
    return time;
  }
  function frame(now) {
    if (!playing) return;
    time = wrap(timeStart + (now - wallStart) / 1000);
    render(time);
    devUpdate();
    rafId = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    wallStart = performance.now(); timeStart = time;
    rafId = requestAnimationFrame(frame);
    devUpdate();
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(rafId);
    devUpdate();
  }

  /* ---------- Dev-Modus ---------- */
  const dev = {
    bar: $("devbar"), play: $("devPlay"), time: $("devTime"), chapter: $("devChapter"),
    cue: $("devCueName"), scrub: $("devScrub"),
  };
  dev.scrub.max = String(total);
  dev.scrub.step = String(1 / SCRIPT.fps);
  let devOn = false;
  const fmt = (t) => {
    const m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t % 1) * SCRIPT.fps);
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(f).padStart(2, "0")}`;
  };
  function chapterAt(t) {
    let cur = chapters[0];
    for (const ch of chapters) if (t >= ch.start) cur = ch;
    return cur;
  }
  function devUpdate() {
    if (!devOn) return;
    dev.time.textContent = `${fmt(time)} / ${fmt(total)}`;
    dev.chapter.textContent = `K${chapterAt(time).id}`;
    dev.cue.textContent = el.devCue.textContent;
    dev.play.textContent = playing ? "Pause" : "Play";
    if (document.activeElement !== dev.scrub) dev.scrub.value = String(time);
  }
  function setDev(on) {
    devOn = on;
    document.body.classList.toggle("dev", on);
    fit();
    devUpdate();
  }
  window.addEventListener("resize", fit);
  fit();
  dev.play.addEventListener("click", () => (playing ? pause() : play()));
  dev.scrub.addEventListener("input", () => { pause(); seek(parseFloat(dev.scrub.value)); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "d" || e.key === "D") { setDev(!devOn); return; }
    if (!devOn) return;
    if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key >= "1" && e.key <= "4") { const ch = chapters.find((k) => k.id === Number(e.key)); if (ch) seek(ch.start); }
    else if (e.key === "ArrowRight") { e.preventDefault(); seek(time + (e.shiftKey ? 1 / SCRIPT.fps : 1)); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seek(time - (e.shiftKey ? 1 / SCRIPT.fps : 1)); }
  });

  /* ---------- Öffentliche Schnittstelle (für Export und Prüfung) ---------- */
  const params = new URLSearchParams(location.search);
  window.film = {
    SCRIPT, total, chapters, seek, play, pause, setDev, render,
    get time() { return time; },
    get playing() { return playing; },
    cueList: cues,
    ready: document.fonts.ready.then(() => { render(time); return true; }),
  };

  document.fonts.ready.then(() => {
    if (params.has("dev")) setDev(true);
    if (params.has("t")) seek(parseFloat(params.get("t")));
    else render(0);
    if (params.get("autoplay") !== "0") play();
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station 9 · neue Entwicklungen</title>
<link rel="stylesheet" href="../../00_design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../shared/css/station-language-switch.css">
<link rel="stylesheet" href="station-09.bundle.css">
</head>
<body>

<div id="scaler">
  <main id="frame" aria-label="Station 9 – neue Entwicklungen">

    <section class="screen screen-start" id="screenStart">
      <div class="station-marker" aria-label="Station 9 - Neue Entwicklungen">
        <span class="station-marker__station">Station 9</span>
        <span class="station-marker__topic">Neue Entwicklungen</span>
      </div>

      <div class="start-copy">
        <span class="eyebrow" id="startEyebrow"></span>
        <h1 class="title title--hero" id="startTitle"></h1>
        <div class="hero-text" id="startIntro" tabindex="0" aria-label="Einführungstext zur Station"></div>
      </div>

      <div class="start-visual" aria-hidden="true">
        <img src="../station-04/img/eknigma02.png" alt="" class="station-image" id="startImage">
      </div>

      <!-- CTA removed for this station -->
    </section>

    <section class="screen screen-action hidden" id="screenAction">
      <header class="action-hdr">
        <div class="action-hdr-copy">
          <span class="eyebrow" id="actionEyebrow"></span>
          <h1 class="title title--compact" id="actionTitle"></h1>
        </div>
        <button class="close-btn" id="btnClose" aria-label="Schließen" type="button">✕</button>
      </header>

      <div class="tabs" role="tablist" aria-label="Stationsmodule">
        <button class="tab active" id="tabModuleA" type="button" role="tab" aria-selected="true">Modul A</button>
        <button class="tab" id="tabModuleB" type="button" role="tab" aria-selected="false">Modul B</button>
        <button class="tab" id="tabModuleC" type="button" role="tab" aria-selected="false">Modul C</button>
      </div>

      <div class="template-grid">
        <section class="template-card template-card--wide module-panel" id="moduleA" role="tabpanel">
          <span class="template-tag">Modul A</span>
          <h2>Erkunden</h2>
          <p id="actionDescription"></p>
        </section>

        <section class="template-card module-panel hidden" id="moduleB" role="tabpanel">
          <span class="template-tag">Modul B</span>
          <h2>Interaktion</h2>
          <p>Platzhalter für das interaktive Element dieser Station.</p>
        </section>

        <section class="template-card module-panel hidden" id="moduleC" role="tabpanel">
          <span class="template-tag" id="deepeningTag"></span>
          <h2 id="deepeningTitle"></h2>
          <div id="deepeningBody"></div>
        </section>
      </div>
    </section>

  </main>
</div>

<script src="../../shared/js/station-language-switch.js"></script>
<script src="station-09.bundle.js" defer></script>
</body>
</html>
